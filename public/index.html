<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070f23">
<title>حرب الطائرات — الأساطير (جماعي)</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#030815;color:white;font-family:system-ui,Tahoma,sans-serif;touch-action:none;user-select:none}#stage{position:absolute;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%);background:#071328;box-shadow:0 0 35px #1250a155}canvas{display:block;width:100%;height:100%}#hud{position:absolute;inset:0 0 auto;padding:8px;pointer-events:none;display:flex;align-items:flex-start;justify-content:space-between;gap:4px;font-size:12px;font-weight:800}#hud .col{display:grid;gap:5px}.pill{background:#061429d9;border:1px solid #6ccaff55;border-radius:11px;padding:5px 8px;white-space:nowrap;backdrop-filter:blur(5px)}button{font-family:inherit;cursor:pointer;border:0;color:white;font-weight:800}#hud button{pointer-events:auto;background:#132b51dd;border:1px solid #4bbaff77;border-radius:10px;padding:7px;font-size:17px}#weaponbar{position:absolute;bottom:12px;left:8px;right:8px;display:flex;justify-content:center;gap:5px;pointer-events:auto}#weaponbar button{min-width:41px;flex:1;max-width:65px;padding:7px 2px;background:#0b193ad9;border:1px solid #3c6a9e;border-radius:11px;font-size:17px}#weaponbar button.sel{border-color:#ffdb62;background:#745015dd;box-shadow:0 0 14px #ffc33c66}#bombBtn{position:absolute;bottom:76px;right:13px;padding:12px;background:#9d313cdd;border:1px solid #ff9999;border-radius:50%;font-size:21px;display:none}#overlay{position:absolute;inset:0;background:#030b1be8;display:flex;justify-content:center;align-items:center;overflow:auto;padding:16px;backdrop-filter:blur(5px)}#overlay.hide{display:none}.panel{width:100%;max-width:430px;max-height:95%;overflow:auto;text-align:center;background:linear-gradient(145deg,#102449,#080f25);border:1px solid #5d9bda77;border-radius:22px;padding:17px;box-shadow:0 10px 50px #0009}.panel h1{font-size:26px;color:#83dfff;margin:6px 0 12px}.panel p{font-size:13px;line-height:1.8;color:#b7cce5}.big{padding:12px 20px;border-radius:13px;background:linear-gradient(100deg,#12a9d6,#6266e8);margin:5px;font-size:15px}.secondary{background:#263f6b}.tabs{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}.tabs button{padding:9px;border-radius:10px;background:#28446d}.card{display:flex;justify-content:space-between;align-items:center;text-align:right;gap:8px;background:#152b4c;border:1px solid #33547d;border-radius:12px;padding:9px;margin:7px 0;font-size:12px}.card small{color:#a8c0db;display:block;margin-top:3px}.card button{background:#137eaa;border-radius:9px;padding:9px;min-width:86px}.card button:disabled{opacity:.5}.tiny{font-size:11px;color:#9bb8d6}.notice{color:#ffe28a!important}#toast{position:absolute;top:110px;left:15%;width:70%;text-align:center;font-weight:900;color:#ffe282;text-shadow:0 2px 8px black;pointer-events:none;opacity:0;transition:opacity .2s}#bossBar{position:absolute;top:72px;left:12%;width:76%;height:11px;border-radius:9px;background:#2b1223;display:none;overflow:hidden;border:1px solid #fff5}#bossFill{height:100%;background:linear-gradient(90deg,#ff445d,#ffcc65);width:100%}
.levelgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0}.levelgrid button{min-height:53px;border-radius:11px;background:#183960;border:1px solid #4b7aa0;font-size:14px}.levelgrid button.locked{opacity:.4;background:#101b31}.levelgrid button.done{background:#205b4b;border-color:#58e8b4}.levelgrid button.current{background:#785426;border-color:#ffcf65}.worldgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.worldgrid button{border-radius:12px;padding:12px 5px;min-height:65px;background:#183455;border:1px solid #4d779a}.worldgrid button:disabled{opacity:.45}.setting{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:right;background:#162d4e;border-radius:12px;padding:12px;margin:9px 0}.setting select,.setting input{max-width:135px;accent-color:#5dd6ff}.setting select{background:#091c36;color:white;padding:7px;border-radius:8px}.progress{height:9px;background:#12233a;border-radius:9px;overflow:hidden;margin:8px 0}.progress>div{height:100%;background:linear-gradient(90deg,#26b5db,#ffc65d)}
.roomcode{font-size:34px;letter-spacing:10px;color:#ffd76c;font-weight:900;text-shadow:0 0 20px #ffc94d99;margin:8px 0}
.badge{display:inline-block;background:#2a7a4f;color:#c9ffd9;padding:3px 9px;border-radius:20px;font-size:11px;margin:0 4px}
.pill.net{border-color:#6dff9d55;color:#9dffb7}
#micBtn.on{background:#1d8348!important;border-color:#4bff7c!important;box-shadow:0 0 12px #4bff7c99}
#remoteAudio{display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="col">
      <div class="pill">🏆 <span id="score">0</span> | 🪙 <span id="coins">0</span></div>
      <div class="pill">❤️ <span id="life">3</span> 🛡️ <span id="shield">0</span></div>
    </div>
    <div class="col" style="text-align:center">
      <div class="pill">🌍 <span id="world">1</span>/20 · <span id="levelHUD">1</span>/20</div>
      <div class="pill">🔥 ×<span id="combo">1</span></div>
      <div class="pill net" id="netPill" style="display:none">🌐 <span id="roomLabel">—</span></div>
    </div>
    <div class="col">
      <button id="pause">⏸</button>
      <button id="sound">🔊</button>
      <button id="micBtn" style="display:none">🎤</button>
    </div>
  </div>

  <div id="bossBar"><div id="bossFill"></div></div>
  <div id="toast"></div>
  <button id="bombBtn">💣</button>
  <div id="weaponbar"></div>

  <div id="overlay" class="hide">
    <div class="panel">
      <h1 id="heading">✈️ حرب الطائرات: الأساطير</h1>
      <div id="content"></div>
    </div>
  </div>
</div>
<audio id="remoteAudio" autoplay playsinline></audio>

<script>
(() => {
  'use strict';

  const W = 480, H = 854, TAU = Math.PI * 2;
  const $ = id => document.getElementById(id);
  const cv = $('game'), ctx = cv.getContext('2d'), stage = $('stage');
  const rnd = (a,b) => a + Math.random()*(b-a);
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

  let dpr = 1;
  function resize(){
    let s = Math.min(innerWidth/W, innerHeight/H);
    stage.style.width = W*s+'px';
    stage.style.height = H*s+'px';
    dpr = Math.min(devicePixelRatio||1, 2);
    cv.width = W*dpr; cv.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize', resize); resize();

  /* =========================================================
     الصور
     ========================================================= */
  const files = {
    player:'player.png',
    player2:'player2.png',
    grunt:'enemy_grunt.png', zig:'enemy_zig.png',
    tank:'enemy_tank.png', boss:'boss.png',
    bullet:'bullet.png',
    bullet2:'bullet2.png',
    ebullet:'ebullet.png', life:'powerup_life.png',
    power:'powerup_power.png', background:'background.png'
  };
  const imgs = {}; let imgLoadedCount = 0;
  const imgTotal = Object.keys(files).length;
  let allImgsReady = false;

  for (const [k,v] of Object.entries(files)) {
    const im = new Image();
    im.onload = () => { im.ok = true; onImgLoad(); };
    im.onerror = () => { im.ok = false; onImgLoad(); };
    im.src = 'images/'+v; imgs[k] = im;
  }
  function onImgLoad(){ if (++imgLoadedCount >= imgTotal) allImgsReady = true; }

  function pic(k, x, y, w, h, rot=0){
    const im = imgs[k];
    if (!im?.ok) return false;
    const ratio = im.naturalWidth / im.naturalHeight;
    if (w/h > ratio) w = h*ratio; else h = w/ratio;
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
    ctx.drawImage(im, -w/2, -h/2, w, h); ctx.restore();
    return true;
  }

  /* =========================================================
     الأسلحة والعوالم
     ========================================================= */
  const WEAP = [
    ['🔫','رشاش','machine','رصاص متواصل سريع'],
    ['🚀','صواريخ','missile','صواريخ تتبع'],
    ['⚡','ليزر','laser','شعاع يخترق'],
    ['💣','قنابل','bomb','قنبلة شاملة'],
    ['🔥','ناري','fire','طلقات نارية'],
    ['🌪️','دائري','radial','رصاص دائري']
  ];
  const WORLD_NAMES = ['سماء المدينة','الصحراء الحربية','المحيط','الجبال الثلجية','الغابة','المدينة المدمرة','المنطقة البركانية','الفضاء','قاعدة الأعداء','العاصفة الرعدية','سماء الغروب','الجزر الطائرة','ممر النيازك','أعماق المحيط','الصحراء الليلية','العالم الجليدي','المجرة البنفسجية','حصن الحديد','بوابة الظلال','المعركة النهائية'];
  const WORLD_PALETTE = [['#07162d','#194d85'],['#281b2d','#c18a43'],['#061b3b','#087eaa'],['#13283f','#9ad0e6'],['#071f19','#28644a'],['#281c23','#7e5047'],['#250b17','#b84324'],['#07051c','#241057'],['#101b2a','#526879'],['#230b2c','#6d1a4c']];
  const WORLD_THEMES = Array.from({length:20},(_,i)=>{
    const b = WORLD_PALETTE[i % WORLD_PALETTE.length];
    return [WORLD_NAMES[i], b[0], b[1]];
  });
  const today = () => new Date().toLocaleDateString('en-CA');

  /* =========================================================
     الحفظ
     ========================================================= */
  let save = {
    coins:0, best:0, unlocked:[0], playerName:'لاعب',
    upgrades:{damage:0, armor:0, magnet:0},
    missions:{date:today(), kills:0, bosses:0, earned:0, claimed:[false,false,false]}
  };
  try {
    const old = JSON.parse(localStorage.getItem('airLegendsSave')||'null');
    if (old) save = {...save, ...old,
      upgrades:{...save.upgrades, ...old.upgrades},
      missions:{...save.missions, ...old.missions}};
  } catch(e){}
  if (save.missions.date !== today()) save.missions = {date:today(),kills:0,bosses:0,earned:0,claimed:[false,false,false]};
  const persist = () => { try { localStorage.setItem('airLegendsSave', JSON.stringify(save)); } catch(e){} };
  save.progress = Math.max(0, Math.min(400, Number(save.progress)||0));
  save.settings = {sound:true, volume:65, particles:'medium', shake:true, stars:true, controls:'normal', ...(save.settings||{})};

  /* =========================================================
     حالة اللعبة
     ========================================================= */
  let selectedLevel = Math.min(399, save.progress);
  let level = 1, worldIndex = 0, levelDuration = 28;
  let state = 'menu', score = 0, earned = 0, kills = 0, world = 1;
  let time = 0, spawn = 0, bossActive = false, bossDone = false;
  let shake = 0, combo = 1, comboTime = 0, slow = 0;
  let toastTime = 0, shotId = 0, weapon = 0, localEid = 0;
  let sound = save.settings.sound;
  let audio = null;

  let enemies = [], shots = [], bad = [], drops = [], particles = [];
  const remoteShots = [];
  /* ★ تقليل عدد النجوم على الأجهزة الضعيفة */
  const starCount = (navigator.hardwareConcurrency || 4) > 4 ? 90 : 50;
  const stars = Array.from({length:starCount},()=>({x:rnd(0,W),y:rnd(0,H),z:rnd(.3,1.4)}));

  const player = {x:W/2,y:H-155,tx:W/2,ty:H-155,hp:3,maxHp:3,inv:0,shield:0,power:1,fire:0,bombs:2,alive:true};

  /* =========================================================
     ★★★ الشبكة ★★★
     ========================================================= */
  const net = {
    ws: null, connected: false, roomCode: '', myId: '', hostId: '', host: false,
    players: new Map(), online: false, sendT: 0,
    pendingBullets: [],          /* ★ طلقات مجمّعة للإرسال */
    lastHurtSent: 0
  };

  function netConnect(cb){
    if (net.ws && net.ws.readyState === WebSocket.OPEN) return cb && cb();
    const q = new URLSearchParams(location.search).get('server');
    let url;
    if (q) url = q.startsWith('ws') ? q : `ws://${q}`;
    else url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;

    net.ws = new WebSocket(url);
    net.ws.onopen = () => { net.connected = true; cb && cb(); };
    net.ws.onclose = () => {
      net.connected = false;
      if (net.online){ net.online = false; cleanupRTC(); toast('⚠️ انقطع الاتصال'); main(); }
    };
    net.ws.onerror = () => toast('❌ تعذّر الاتصال بالخادم');
    net.ws.onmessage = e => { try { handleNet(JSON.parse(e.data)); } catch(err){} };
  }
  function netSend(o){ if (net.ws && net.ws.readyState === 1) net.ws.send(JSON.stringify(o)); }

  function handleNet(m){
    switch(m.t){
      case 'joined':
        net.roomCode = m.code; net.myId = m.id; net.hostId = m.hostId;
        net.host = m.hostId === m.id;
        net.players = new Map();
        m.players.forEach(p => net.players.set(p.id, p));
        updateMicUI(); lobbyScreen(); break;
      case 'lobby':
        net.players = new Map();
        m.players.forEach(p => net.players.set(p.id, p));
        net.hostId = m.host;
        net.host = m.host === net.myId;
        if (state === 'lobby') lobbyScreen();
        break;
      case 'start': startOnline(m.levelIndex); break;
      case 'S': applySnapshot(m); break;
      case 'shoot': onRemoteShoot(m); break;
      case 'kill': onKill(m.id); break;
      case 'hp': onHpMsg(m); break;
      case 'boss': bossActive = true; toast('⚠️ ظهر الزعيم!'); break;
      case 'over': finishOnline(!!m.win); break;
      case 'left':
        net.players.delete(m.id);
        if (state === 'play' || state === 'lobby') toast('🚪 غادر أحد اللاعبين');
        cleanupRTC(); break;
      case 'err': toast(m.msg); break;
      case 'rtc-desc': handleRTCDesc(m); break;
      case 'rtc-ice':  handleRTCIce(m);  break;
    }
  }

  function applySnapshot(m){
    const seen = new Set();
    for (const [id,type,x,y,hp,max,r] of m.enemies){
      seen.add(id);
      let e = enemies.find(v => v.id === id);
      if (!e){
        enemies.push({ id, type, x, y, tx:x, ty:y, hp, max, r, t:0, dir:1,
          flash:0, score: type==='boss'?300 : type==='tank'?35 : 15 });
      } else { e.tx = x; e.ty = y; e.hp = hp; e.max = max; }
    }
    for (let i = enemies.length-1; i>=0; i--) if (!seen.has(enemies[i].id)) enemies.splice(i,1);

    const ebSeen = new Set();
    for (const [id,x,y,vx,vy] of m.eb){
      ebSeen.add(id);
      let b = bad.find(v => v.id === id);
      if (!b) bad.push({ id, x, y, vx, vy, r:7 });
      else { b.x += (x-b.x)*0.4; b.y += (y-b.y)*0.4; b.vx = vx; b.vy = vy; }
    }
    for (let i = bad.length-1; i>=0; i--) if (!ebSeen.has(bad[i].id)) bad.splice(i,1);

    const pm = new Map();
    for (const [id,x,y,hp,alive,name] of m.players)
      pm.set(id, { id, x, y, hp, alive:!!alive, name });
    net.players = pm;

    const me = pm.get(net.myId);
    if (me){
      player.hp = me.hp;
      if (me.alive !== player.alive){
        player.alive = me.alive;
        if (me.alive){ player.inv = 2; toast('✨ عدت للمعركة!'); }
        else toast('💀 ستعود بعد 6 ثوانٍ...');
      }
    }
  }

  function onRemoteShoot(m){
    const sprite = m.owner === net.hostId ? 'bullet' : 'bullet2';
    for (const b of m.bullets){
      remoteShots.push({ ...b, owner: m.owner, sprite, life: 2.5 });
    }
    /* حد أمان للذاكرة */
    if (remoteShots.length > 300) remoteShots.splice(0, remoteShots.length - 300);
  }

  function onHpMsg(m){
    if (m.id === net.myId){
      player.hp = m.hp; player.alive = m.alive;
      if (!m.alive) toast('💀 ستعود بعد 6 ثوانٍ...');
    }
  }

  function onKill(id){
    const i = enemies.findIndex(e => e.id === id);
    if (i < 0) return;
    const e = enemies[i]; enemies.splice(i,1);
    combo = Math.min(9, combo+1); comboTime = 3;
    shake = Math.max(shake, e.type==='boss'?15:4);
    burst(e.x, e.y, e.type==='boss'?'#ffcb62':'#ff7d53', e.type==='boss'?60:18);
    if (e.type === 'boss'){ bossActive = false; bossDone = true; gain(100+world*20); toast('🏆 هزم الفريق الزعيم!'); }
    else { kills++; score += e.score*combo; gain(2+world); }
    if (Math.random() < .12) drops.push({x:e.x, y:e.y, kind:['power','life','shield','slow','bomb'][Math.floor(rnd(0,5))], t:0});
    persist();
  }

  function netHurt(){
    if (!player.alive || player.inv > 0) return;
    const now = Date.now();
    if (now - net.lastHurtSent < 600) return;
    net.lastHurtSent = now;
    player.inv = 1.0;
    netSend({ t:'hurt' });
    tone(160, .3); shake = 11;
    burst(player.x, player.y, '#8feaff', 22);
  }

  /* =========================================================
     الصوت
     ========================================================= */
  function tone(f=440, d=.08){
    if (!sound) return;
    try {
      audio ??= new (window.AudioContext||window.webkitAudioContext)();
      audio.resume();
      const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
      o.type='triangle';
      o.frequency.setValueAtTime(f,t);
      o.frequency.exponentialRampToValueAtTime(Math.max(40,f*.4), t+d);
      g.gain.setValueAtTime(.035*save.settings.volume/100, t);
      g.gain.exponentialRampToValueAtTime(.0001, t+d);
      o.connect(g); g.connect(audio.destination);
      o.start(t); o.stop(t+d);
    } catch(e){}
  }

  /* =========================================================
     ★★★ WebRTC — دردشة صوتية (مع TURN لليمن) ★★★
     ========================================================= */
  let peerConn = null, localStream = null, micOn = false;
  let makingOffer = false, ignoreOffer = false, isSettingRemoteAnswerPending = false;
  const polite = () => !net.host;
  const remoteAudio = document.getElementById('remoteAudio');

  /* ★ بيانات TURN — احصل على بياناتك الخاصة من metered.ca لضمان الاستقرار
     البيانات هنا تجريبية عامة وقد تتوقف عن العمل. المسار الأساسي: turns:443 */
  const ICE_SERVERS = [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'turn:standard.relay.metered.ca:80',
      username: '380206f8f45c439e995caf4b', credential: 'hvuSwyB2WIWNhG4M' },
    { urls: 'turn:standard.relay.metered.ca:80?transport=tcp',
      username: '380206f8f45c439e995caf4b', credential: 'hvuSwyB2WIWNhG4M' },
    { urls: 'turn:standard.relay.metered.ca:443',
      username: '380206f8f45c439e995caf4b', credential: 'hvuSwyB2WIWNhG4M' },
    /* ★ الأهم لليمن: TURN عبر TLS على 443 يشبه HTTPS */
    { urls: 'turns:standard.relay.metered.ca:443?transport=tcp',
      username: '380206f8f45c439e995caf4b', credential: 'hvuSwyB2WIWNhG4M' }
  ];

  function ensurePC(){
    if (peerConn) return;
    peerConn = new RTCPeerConnection({
      iceServers: ICE_SERVERS,
      iceTransportPolicy: 'all',
      bundlePolicy: 'max-bundle'
    });

    peerConn.onicecandidate = ({ candidate }) => {
      if (candidate) netSend({ t:'rtc-ice', cand: candidate });
    };
    peerConn.ontrack = ({ streams: [stream] }) => {
      remoteAudio.srcObject = stream;
      remoteAudio.play().catch(()=>{});
      toast('🔊 متصل صوتياً');
    };
    peerConn.onnegotiationneeded = async () => {
      try {
        makingOffer = true;
        await peerConn.setLocalDescription();
        netSend({ t:'rtc-desc', desc: peerConn.localDescription });
      } catch (e) { console.error(e); }
      finally { makingOffer = false; }
    };
    peerConn.onconnectionstatechange = async () => {
      const s = peerConn.connectionState;
      if (s === 'connected') {
        try {
          const stats = await peerConn.getStats();
          let usedRelay = false;
          stats.forEach(r => {
            if (r.type === 'candidate-pair' && r.state === 'succeeded') {
              const local = stats.get(r.localCandidateId);
              if (local && local.candidateType === 'relay') usedRelay = true;
            }
          });
          toast(usedRelay ? '🎤 الصوت متصل عبر TURN (يعمل في اليمن)' : '🎤 الصوت متصل مباشرة');
        } catch(_) { toast('🎤 الصوت متصل'); }
      }
      if (s === 'failed') toast('⚠️ فشل الاتصال الصوتي — أعد المحاولة');
    };
  }

  async function handleRTCDesc(m){
    ensurePC();
    const readyForOffer = !makingOffer &&
      (peerConn.signalingState === 'stable' || isSettingRemoteAnswerPending);
    const offerCollision = m.desc.type === 'offer' && !readyForOffer;

    ignoreOffer = !polite() && offerCollision;
    if (ignoreOffer) return;

    isSettingRemoteAnswerPending = m.desc.type === 'answer';
    await peerConn.setRemoteDescription(m.desc);
    isSettingRemoteAnswerPending = false;

    if (m.desc.type === 'offer'){
      await peerConn.setLocalDescription();

  async function toggleMic(){
    if (micOn){
      micOn = false;
      if (localStream){
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      if (peerConn){
        peerConn.getSenders().forEach(s => { if (s.track) peerConn.removeTrack(s); });
      }
      updateMicUI();
      return;
    }
    try {
      micOn = true; updateMicUI();
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
      ensurePC();
      for (const t of localStream.getTracks()) peerConn.addTrack(t, localStream);
      toast('🎤 الميكروفون مفتوح');
    } catch (err){
      toast('❌ فشل المايك: ' + err.message);
      micOn = false; updateMicUI();
    }
  }

  function gain(n){ save.coins += n; earned += n; save.missions.earned += n; persist(); }

  function burst(x, y, color, n=18){
    n = Math.round(n * ({low:.35, medium:1, high:1.5}[save.settings.particles]||1));
    for (let i = 0; i < n && particles.length < 400; i++){
      const a = rnd(0,TAU), v = rnd(45,240), life = rnd(.2,.7);
      particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life,max:life,color,r:rnd(1,4)});
    }
  }

  function addShot(x,y,vx,vy,damage=1,kind='machine',r=5){
    shots.push({id:++shotId,x,y,vx,vy,damage,kind,r,hit:new Set(),life:2.5});
  }
  function nearest(x,y){
    let best = null, d = Infinity;
    for (const e of enemies){
      const z = (e.x-x)**2 + (e.y-y)**2;
      if (z < d){ d = z; best = e; }
    }
    return best;
  }

  /* ★★★ الإطلاق — يجمع الطلقات في net.pendingBullets ★★★ */
  function fire(){
    const x = player.x, y = player.y-29;
    const damage = 1 + save.upgrades.damage*.35;
    const extra = player.power - 1;
    const newBullets = [];

    if (weapon === 0) for (let i = -extra; i <= extra; i++) newBullets.push({x:x+i*9, y, vx:i*34, vy:-850, dmg:damage, kind:'machine', r:5});
    if (weapon === 1) for (let i = 0; i < 1+Math.floor(extra/2); i++) newBullets.push({x:x+(i-.5)*18, y, vx:0, vy:-440, dmg:damage*3, kind:'missile', r:9});
    if (weapon === 2) newBullets.push({x, y, vx:0, vy:-1100, dmg:damage*1.4, kind:'laser', r:11});
    if (weapon === 4) for (let i = -1-extra; i <= 1+extra; i++) newBullets.push({x:x+i*6, y, vx:i*60, vy:-680, dmg:damage*1.5, kind:'fire', r:8});
    if (weapon === 5){
      const n = 10 + extra*2;
      for (let i = 0; i < n; i++){
        const a = TAU*i/n;
        newBullets.push({x, y, vx:Math.cos(a)*550, vy:Math.sin(a)*550, dmg:damage, kind:'radial', r:5});
      }
    }

    /* إضافة محلية للتصادم والرسم */
    for (const b of newBullets) addShot(b.x, b.y, b.vx, b.vy, b.dmg, b.kind, b.r);

    /* ★ تجميع للبث مع رسالة الموقع */
    if (net.online){
      for (const b of newBullets){
        net.pendingBullets.push({ x:b.x, y:b.y, vx:b.vx, vy:b.vy, kind:b.kind, r:b.r });
      }
      if (net.pendingBullets.length > 200)
        net.pendingBullets.splice(0, net.pendingBullets.length - 200);
    }
    tone(weapon===1?330:950, .035);
  }

  function bomb(){
    if (state !== 'play' || player.bombs <= 0 || !player.alive) return;
    player.bombs--;
    bad = [];
    shake = 19;
    burst(player.x, player.y, '#fff4a4', 75);
    if (net.online){
      for (const e of enemies) netSend({ t:'hit', id:e.id, dmg: e.type==='boss'?12:100 });
    } else {
      for (let i = enemies.length-1; i >= 0; i--){
        const e = enemies[i];
        e.hp -= e.type==='boss' ? 35 : 100;
        if (e.hp <= 0) kill(i);
      }
    }
    tone(90, .6); hud();
  }

  function enemySpawn(){
    const difficulty = 1 + selectedLevel*.022;
    const pattern = (level+world)%5;
    const roll = Math.random();
    const type = roll < Math.min(.48, .08+difficulty*.065+(pattern===2?.12:0)) ? 'tank'
               : roll < (.52+(pattern===1?.18:0)) ? 'zig' : 'grunt';
    const r = type==='tank'?25:19;
    const hp = type==='tank'?Math.ceil(4+difficulty*2.2)
             : type==='zig'?Math.ceil(1+difficulty*.8)
             : Math.ceil(difficulty*.48);
    enemies.push({
      id: 'L'+(++localEid), type, x:rnd(40,W-40), y:-55, r, hp, max:hp,
      vy: (type==='tank'?75:125) + Math.min(210, difficulty*17) + (pattern===3?35:0),
      fire: rnd(1,2.5), t:0, dir:1,
      score: type==='tank'?35:15
    });
  }

  function boss(){
    bossActive = true;
    const hp = Math.ceil(38 + selectedLevel*2.4 + level*3.5);
    enemies.push({ id:'B'+(++localEid), type:'boss', x:W/2, y:-110, r:62, hp, max:hp,
      vy:0, fire:1.5, t:0, dir:1, enter:true, score:300+world*100 });
    toast('⚠️ زعيم المرحلة ' + world + ' · المستوى ' + level);
    tone(130, .5);
  }

  function kill(i){
    const e = enemies[i];
    if (!e) return;
    enemies.splice(i,1);
    score += e.score*combo;
    combo = Math.min(9, combo+1); comboTime = 3;
    shake = Math.max(shake, e.type==='boss'?15:4);
    burst(e.x, e.y, e.type==='boss'?'#ffcb62':'#ff7d53', e.type==='boss'?60:18);
    if (e.type === 'boss'){
      bossActive = false; bossDone = true;
      save.missions.bosses++;
      gain(100+world*20);
      toast('🏆 هزمت زعيم العالم ' + world);
      for (let j = 0; j < 3; j++) drops.push({x:e.x+rnd(-55,55), y:e.y, kind:j===0?'life':j===1?'power':'bomb', t:0});
    } else {
      kills++; save.missions.kills++;
      gain(2+world);
      if (Math.random() < .12) drops.push({x:e.x, y:e.y, kind:['power','life','shield','slow','bomb'][Math.floor(rnd(0,5))], t:0});
    }
    persist();
  }

  function hurt(){
    if (!player.alive || player.inv > 0) return;
    if (player.shield > 0){ player.shield = Math.max(0, player.shield-2); player.inv = .35; tone(800,.05); return; }
    player.hp--; player.inv = 2; combo = 1; shake = 13;
    burst(player.x, player.y, '#8feaff', 28);
    tone(160, .3);
    if (player.hp <= 0) finish(false);
  }

  function aimed(x,y,s=235){
    const dx = player.x-x, dy = player.y-y, L = Math.hypot(dx,dy)||1;
    bad.push({ id:'e'+Math.random(), x, y, vx:dx/L*s, vy:dy/L*s, r:7 });
  }

  /* =========================================================
     التحديث
     ========================================================= */
  function update(dt){
    const ds = dt/1000;
    time += ds;
    toastTime -= ds;
    if (toastTime <= 0) $('toast').style.opacity = 0;

    player.inv = Math.max(0, player.inv - ds);
    player.shield = Math.max(0, player.shield - ds);
    slow = Math.max(0, slow - ds);
    comboTime -= ds;
    if (comboTime <= 0) combo = 1;

    if (player.alive){
      const move = 380*ds;
      if (keys.ArrowLeft  || keys.KeyA) player.tx -= move;
      if (keys.ArrowRight || keys.KeyD) player.tx += move;
      if (keys.ArrowUp    || keys.KeyW) player.ty -= move;
      if (keys.ArrowDown  || keys.KeyS) player.ty += move;
      player.tx = clamp(player.tx, 25, W-25);
      player.ty = clamp(player.ty, 110, H-95);

      const k = 1 - Math.exp(-13*ds);
      player.x += (player.tx-player.x)*k;
      player.y += (player.ty-player.y)*k;

      player.fire -= ds;
      if (player.fire <= 0){ fire(); player.fire = [.13,.48,.13,1,.25,.55][weapon]; }
    }

    if (net.online){
      for (const e of enemies){
        const k = Math.min(1, ds*14);
        e.x += (e.tx - e.x)*k;
        e.y += (e.ty - e.y)*k;
        e.t += ds;
        if (e.flash > 0) e.flash -= ds;
      }
      for (let i = bad.length-1; i >= 0; i--){
        const b = bad[i];
        b.x += b.vx*ds; b.y += b.vy*ds;
        if (b.y > H+50 || b.y < -50 || b.x < -50 || b.x > W+50){ bad.splice(i,1); continue; }
        if (player.alive && Math.hypot(b.x-player.x, b.y-player.y) < b.r+13){ bad.splice(i,1); netHurt(); }
      }
      if (player.alive) for (const e of enemies){
        if (Math.hypot(e.x-player.x, e.y-player.y) < e.r*.7 + 13) netHurt();
      }
      for (let i = remoteShots.length-1; i >= 0; i--){
        const b = remoteShots[i];
        b.life -= ds;
        if (b.kind === 'missile'){
          const t = nearest(b.x, b.y);
          if (t){
            const dx = t.x-b.x, dy = t.y-b.y, d = Math.hypot(dx,dy)||1;
            b.vx += (dx/d*570 - b.vx)*Math.min(1,ds*4);
            b.vy += (dy/d*570 - b.vy)*Math.min(1,ds*4);
          }
        }
        b.x += b.vx*ds; b.y += b.vy*ds;
        if (b.life <= 0 || b.y < -50 || b.y > H+50 || b.x < -50 || b.x > W+50) remoteShots.splice(i,1);
      }

      /* ★★★ إرسال مجمّع كل 100 مللي ثانية ★★★ */
      net.sendT -= ds;
      if (net.sendT <= 0){
        net.sendT = 0.10;
        const msg = { t:'p', x:Math.round(player.x), y:Math.round(player.y) };
        if (net.pendingBullets.length){
          msg.shoot = net.pendingBullets;
          net.pendingBullets = [];
        }
        netSend(msg);
      }
    } else {
      if (!bossActive && !bossDone && time >= levelDuration) boss();
      if (bossDone){ finish(true); return; }
      if (!bossActive){
        spawn -= ds;
        if (spawn <= 0){
          enemySpawn();
          spawn = Math.max(.22, 1.12 - selectedLevel*.0021 - (level%5)*.045) * rnd(.7,1.3);
        }
      }
      const factor = slow > 0 ? .45 : 1;
      for (let i = enemies.length-1; i >= 0; i--){
        const e = enemies[i];
        e.t += ds;
        if (e.type === 'boss'){
          if (e.enter){ e.y += 95*ds; if (e.y >= 132){ e.y = 132; e.enter = false; } }
          else {
            e.x += e.dir*(80+world*9)*ds*factor;
            if (e.x < 75 || e.x > W-75) e.dir *= -1;
            e.fire -= ds*factor;
            if (e.fire <= 0){
              e.fire = Math.max(.65, 1.6 - world*.08);
              for (let j = 0; j < 7; j++){
                const a = Math.PI*(.1 + j*.8/6);
                bad.push({id:'e'+Math.random(), x:e.x, y:e.y+35, vx:Math.cos(a)*220, vy:Math.sin(a)*220, r:7});
              }
              aimed(e.x, e.y+30, 245 + world*8);
            }
          }
        } else {
          e.y += e.vy*ds*factor;
          if (e.type === 'zig') e.x = clamp(e.x + Math.sin(e.t*5)*150*ds, 25, W-25);
          if (e.type === 'tank'){
            e.fire -= ds*factor;
            if (e.fire <= 0 && e.y > 20){ e.fire = 1.5; aimed(e.x, e.y); }
          }
        }
        if (e.y > H+65){ enemies.splice(i,1); continue; }
        if (Math.hypot(e.x-player.x, e.y-player.y) < e.r*.7 + 13){
          if (e.type !== 'boss'){ enemies.splice(i,1); burst(e.x, e.y, '#ffa765', 15); }
          hurt();
        }
      }
      for (let i = bad.length-1; i >= 0; i--){
        const b = bad[i];
        b.x += b.vx*ds*factor; b.y += b.vy*ds*factor;
        if (b.y > H+40 || b.y < -40 || b.x < -40 || b.x > W+40){ bad.splice(i,1); continue; }
        if (Math.hypot(b.x-player.x, b.y-player.y) < b.r+12){ bad.splice(i,1); hurt(); }
      }
    }

    /* رصاص اللاعب المحلي — التصادم */
    for (let i = shots.length-1; i >= 0; i--){
      const b = shots[i];
      b.life -= ds;
      if (b.kind === 'missile'){
        const t = nearest(b.x, b.y);
        if (t){
          const dx = t.x-b.x, dy = t.y-b.y, d = Math.hypot(dx,dy)||1;
          b.vx += (dx/d*570 - b.vx)*Math.min(1,ds*4);
          b.vy += (dy/d*570 - b.vy)*Math.min(1,ds*4);
        }
      }
      b.x += b.vx*ds; b.y += b.vy*ds;
      if (b.life <= 0 || b.y < -45 || b.y > H+40 || b.x < -45 || b.x > W+45){ shots.splice(i,1); continue; }

      let removed = false;
      for (let j = enemies.length-1; j >= 0; j--){
        const e = enemies[j];
        if (b.hit.has(e.id)) continue;
        if (Math.hypot(e.x-b.x, e.y-b.y) < e.r + b.r){
          b.hit.add(e.id);
          burst(b.x, b.y, '#b7f6ff', 3);
          if (net.online){
            e.flash = .12;
            netSend({ t:'hit', id:e.id, dmg:b.damage });
          } else {
            e.hp -= b.damage;
            if (e.hp <= 0) kill(j);
          }
          if (b.kind !== 'laser'){ shots.splice(i,1); removed = true; }
          break;
        }
      }
      if (removed) continue;
    }

    /* القوى الساقطة */
    for (let i = drops.length-1; i >= 0; i--){
      const a = drops[i];
      a.t += ds; a.y += 95*ds;
      a.x += Math.sin(a.t*4)*22*ds;
      if (a.y > H+30){ drops.splice(i,1); continue; }
      if (Math.hypot(a.x-player.x, a.y-player.y) < 33 + save.upgrades.magnet*13){
        drops.splice(i,1);
        if (a.kind === 'life')   player.hp = Math.min(player.maxHp, player.hp+1);
        if (a.kind === 'power')  player.power = Math.min(3, player.power+1);
        if (a.kind === 'shield') player.shield = 9;
        if (a.kind === 'slow')   slow = 7;
        if (a.kind === 'bomb')   player.bombs = Math.min(5, player.bombs+1);
        gain(8);
        toast({life:'❤️ حياة', power:'⚡ تعزيز', shield:'🛡️ درع', slow:'❄️ إبطاء', bomb:'💣 قنبلة'}[a.kind]);
        tone(1100, .13);
      }
    }

    /* جزيئات ونجوم */
    for (let i = particles.length-1; i >= 0; i--){
      const a = particles[i];
      a.life -= ds; a.x += a.vx*ds; a.y += a.vy*ds;
      a.vx *= .97; a.vy *= .97;
      if (a.life <= 0) particles.splice(i,1);
    }
    for (const s of stars){
      s.y += (50 + s.z*140)*ds;
      if (s.y > H){ s.y = 0; s.x = rnd(0,W); }
    }

    hud();
  }

  function ship(x,y,size,color,enemy=false){
    ctx.save(); ctx.translate(x,y); ctx.scale(size/70, size/70);
    ctx.fillStyle = color; ctx.strokeStyle = '#e0f6ff'; ctx.lineWidth = 2;
    ctx.beginPath();
    if (enemy){
      ctx.moveTo(0,30); ctx.lineTo(-30,-14); ctx.lineTo(-8,-9);
      ctx.lineTo(0,-28); ctx.lineTo(8,-9); ctx.lineTo(30,-14);
    } else {
      ctx.moveTo(0,-34); ctx.lineTo(9,-11); ctx.lineTo(32,12);
      ctx.lineTo(32,20); ctx.lineTo(8,11); ctx.lineTo(7,28);
      ctx.lineTo(-7,28); ctx.lineTo(-8,11); ctx.lineTo(-32,20);
      ctx.lineTo(-32,12); ctx.lineTo(-9,-11);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function ownSprite(){ return net.online && !net.host ? 'player2' : 'player'; }
  function otherSprite(){ return net.host ? 'player2' : 'player'; }
  function ownBulletSprite(){ return net.online && !net.host ? 'bullet2' : 'bullet'; }
  function ownFallbackColor(){ return net.online && !net.host ? '#ff8b5a' : '#4db7ff'; }

  /* ★ تخزين تدرّج الخلفية (توفير إعادة الإنشاء كل إطار) ★ */
  let bgCache = null, bgCacheWorld = -1;
  function getBg(){
    if (bgCacheWorld === world && bgCache) return bgCache;
    const theme = WORLD_THEMES[world-1];
    const bg = ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0, theme[1]);
    bg.addColorStop(1, theme[2]);
    bgCache = bg; bgCacheWorld = world;
    return bg;
  }

  function render(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle = getBg();
    ctx.fillRect(0,0,W,H);
    if (world === 1 && imgs.background?.ok) pic('background', W/2, H/2, W, H);

    ctx.save();
    if (save.settings.shake && shake > .2){
      ctx.translate(rnd(-shake,shake), rnd(-shake,shake));
      shake *= .86;
    }

    ctx.fillStyle = '#b9e6ff';
    for (const s of (save.settings.stars ? stars : [])){
      ctx.globalAlpha = .16 + s.z*.5;
      ctx.fillRect(s.x, s.y, s.z*2, s.z*3);
    }
    ctx.globalAlpha = 1;

    for (const a of drops){
      ctx.save(); ctx.shadowBlur = 20; ctx.shadowColor = '#fff9a0';
      const key = a.kind === 'life' ? 'life' : a.kind === 'power' ? 'power' : 'missing';
      if (!pic(key, a.x, a.y, 48, 48)){
        ctx.fillStyle = {life:'#ff5d7d',power:'#ffd76c',shield:'#62d9ff',slow:'#9de8ff',bomb:'#ff9e4e'}[a.kind];
        ctx.beginPath(); ctx.arc(a.x, a.y, 20, 0, TAU); ctx.fill();
        ctx.font = 'bold 23px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#091325';
        ctx.fillText({life:'♥',power:'⚡',shield:'◆',slow:'❄',bomb:'●'}[a.kind], a.x, a.y);
      }
      ctx.restore();
    }

    for (const e of enemies){
      const sz = e.type === 'boss' ? 172 : e.type === 'tank' ? 92 : 69;
      ctx.save();
      if (e.flash > 0) ctx.filter = 'brightness(2.2)';
      if (!pic(e.type, e.x, e.y, sz, sz, e.type==='zig'?Math.sin(e.t*5)*.2:0)){
        ship(e.x, e.y, sz,
          e.type==='boss'?'#e84d5a':e.type==='tank'?'#cf493a':e.type==='zig'?'#aa57f6':'#ffab3b', true);
      }
      ctx.restore();
    }

    const bossEnemy = enemies.find(e => e.type === 'boss');
    $('bossBar').style.display = bossEnemy && !bossEnemy.enter ? 'block' : 'none';
    if (bossEnemy) $('bossFill').style.width = 100*Math.max(0, bossEnemy.hp/bossEnemy.max) + '%';

    ctx.globalCompositeOperation = 'lighter';
    for (const b of bad){
      if (!pic('ebullet', b.x, b.y, 26, 26)){
        ctx.fillStyle = '#ff7b52';
        ctx.beginPath(); ctx.arc(b.x, b.y, 8, 0, TAU); ctx.fill();
      }
    }
    for (const b of remoteShots){
      const rot = Math.atan2(b.vy, b.vx) + Math.PI/2;
      ctx.shadowBlur = 12; ctx.shadowColor = '#ffd86b';
      if (b.kind === 'laser'){
        ctx.fillStyle = '#ffd76c';
        ctx.fillRect(b.x-5, b.y-26, 10, 52);
      } else if (b.kind === 'missile'){
        ctx.fillStyle = '#ffb85c';
        ctx.beginPath(); ctx.arc(b.x, b.y, 9, 0, TAU); ctx.fill();
      } else if (b.kind === 'fire'){
        ctx.fillStyle = '#ffb04d';
        ctx.beginPath(); ctx.arc(b.x, b.y, 9, 0, TAU); ctx.fill();
      } else if (!pic(b.sprite, b.x, b.y, 18, 38, rot)){
        ctx.fillStyle = '#ffcf6c';
        ctx.fillRect(b.x-3, b.y-14, 6, 27);
      }
    }
    ctx.shadowBlur = 0;
    for (const b of shots){
      ctx.shadowBlur = 12;
      ctx.shadowColor = b.kind === 'fire' ? '#ff6d22' : '#6de9ff';
      if (b.kind === 'laser'){
        ctx.fillStyle = '#71edff';
        ctx.fillRect(b.x-5, b.y-26, 10, 52);
      } else if (b.kind === 'missile'){
        ctx.fillStyle = '#ffdc82';
        ctx.beginPath(); ctx.arc(b.x, b.y, 9, 0, TAU); ctx.fill();
      } else if (b.kind === 'fire'){
        ctx.fillStyle = '#ff7536';
        ctx.beginPath(); ctx.arc(b.x, b.y, 9, 0, TAU); ctx.fill();
      } else if (!pic(ownBulletSprite(), b.x, b.y, 18, 38, Math.atan2(b.vy,b.vx)+Math.PI/2)){
        ctx.fillStyle = '#86edff';
        ctx.fillRect(b.x-3, b.y-14, 6, 27);
      }
    }
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';

    if (net.online){
      for (const [id,p] of net.players){
        if (id === net.myId || !p.alive) continue;
        if (!pic(otherSprite(), p.x, p.y, 80, 80)){
          ship(p.x, p.y, 80, net.host ? '#ff8b5a' : '#4db7ff');
        }
        ctx.strokeStyle = '#7cff9c'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(p.x, p.y, 42, 0, TAU); ctx.stroke();
        ctx.fillStyle = '#a6ffbe';
        ctx.font = 'bold 11px system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(p.name || 'لاعب', p.x, p.y - 52);
      }
    }

    if (player.alive && state !== 'over' && (player.inv <= 0 || Math.floor(performance.now()/90)%2)){
      if (!pic(ownSprite(), player.x, player.y, 80, 80)) ship(player.x, player.y, 80, ownFallbackColor());
      if (player.shield > 0){
        ctx.strokeStyle = '#73eaff'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(player.x, player.y, 43, 0, TAU); ctx.stroke();
      }
    }

    ctx.globalCompositeOperation = 'lighter';
    for (const a of particles){
      ctx.globalAlpha = Math.max(0, a.life/a.max);
      ctx.fillStyle = a.color;
      ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
  }

  function renderLoading(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const bg = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,H*.75);
    bg.addColorStop(0,'#0d1f3d'); bg.addColorStop(.5,'#071328'); bg.addColorStop(1,'#030815');
    ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
    for (const s of stars){
      s.y += s.z*1.4;
      if (s.y > H){ s.y = 0; s.x = Math.random()*W; }
      ctx.globalAlpha = .15+s.z*.55; ctx.fillStyle = '#b9e6ff';
      ctx.fillRect(s.x, s.y, s.z*2, s.z*3);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.save();
    ctx.shadowColor = '#4fb8ff'; ctx.shadowBlur = 40;
    ctx.fillStyle = '#83dfff'; ctx.font = 'bold 76px system-ui, sans-serif';
    ctx.fillText('✈️', W/2, H/2-175); ctx.restore();
    const tg = ctx.createLinearGradient(W/2-130,0,W/2+130,0);
    tg.addColorStop(0,'#7fe4ff'); tg.addColorStop(.5,'#b58cff'); tg.addColorStop(1,'#ff7fd0');
    ctx.fillStyle = tg; ctx.font = 'bold 28px system-ui, sans-serif';
    ctx.fillText('حرب الطائرات', W/2, H/2-105);
    ctx.fillStyle = '#83dfff'; ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.fillText('— الأساطير —', W/2, H/2-72);
    const prog = imgTotal > 0 ? imgLoadedCount/imgTotal : 0;
    const barW = 280, barH = 18, barX = W/2-barW/2, barY = H/2+40;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(barX-4,barY-4,barW+8,barH+8,12); else ctx.rect(barX-4,barY-4,barW+8,barH+8);
    ctx.fill();
    ctx.fillStyle = '#12233d';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(barX,barY,barW,barH,9); else ctx.rect(barX,barY,barW,barH);
    ctx.fill();
    if (prog > 0){
      const f = ctx.createLinearGradient(barX,0,barX+barW,0);
      f.addColorStop(0,'#4fb8ff'); f.addColorStop(.5,'#8a7bff'); f.addColorStop(1,'#ff7fd0');
      ctx.fillStyle = f;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(barX,barY,barW*prog,barH,9); else ctx.rect(barX,barY,barW*prog,barH);
      ctx.fill();
    }
    ctx.strokeStyle = '#7fe4ff'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(barX,barY,barW,barH,9); else ctx.rect(barX,barY,barW,barH);
    ctx.stroke();
    ctx.fillStyle = '#e6f3ff'; ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.fillText('جاري التحميل... ' + Math.floor(prog*100) + '%', W/2, barY+barH+32);
    ctx.fillStyle = '#6c88a8'; ctx.font = '12px system-ui, sans-serif';
    ctx.fillText('(' + imgLoadedCount + '/' + imgTotal + ' صور)', W/2, barY+barH+56);
  }

  /* ★★★ الحلقة — تتوقف عند إخفاء الصفحة ★★★ */
  let last = 0, mainShown = false;
  function loop(ts){
    requestAnimationFrame(loop);
    if (!allImgsReady){ last = ts; renderLoading(); return; }
    if (!mainShown){ mainShown = true; main(); }
    if (document.hidden){ last = ts; return; }   /* ★ توفير المعالج */

    let dt = Math.min(40, ts - (last||ts));
    last = ts;
    if (state === 'play') update(dt);
    else for (const s of stars){ s.y += s.z*.35; if (s.y > H) s.y = 0; }
    render();
  }

  /* الإدخال */
  let dragging = false, sx = 0, sy = 0, px = 0, py = 0;
  const keys = {};
  function point(e){
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX-r.left)/r.width*W, y: (e.clientY-r.top)/r.height*H };
  }
  cv.onpointerdown = e => {
    if (state !== 'play') return;
    dragging = true;
    const a = point(e);
    sx = a.x; sy = a.y; px = player.tx; py = player.ty;
    cv.setPointerCapture(e.pointerId);
  };
  cv.onpointermove = e => {
    if (!dragging || state !== 'play') return;
    const a = point(e);
    const sens = {slow:.7, normal:1.1, fast:1.5}[save.settings.controls] || 1.1;
    player.tx = clamp(px + (a.x-sx)*sens, 25, W-25);
    player.ty = clamp(py + (a.y-sy)*sens, 110, H-95);
  };
  cv.onpointerup = cv.onpointercancel = () => dragging = false;

  addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault();
    if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play') pause();
    if (e.code === 'Space' && state === 'play') bomb();
    if (e.code === 'KeyM') toggleMic();
    if (/^Digit[1-6]$/.test(e.code)){
      const i = +e.code.slice(-1)-1;
      if (save.unlocked.includes(i)){ weapon = i; buildBar(); }
    }
  });
  addEventListener('keyup', e => keys[e.code] = false);

  $('pause').onclick = pause;
  $('sound').onclick = () => { sound = !sound; $('sound').textContent = sound ? '🔊' : '🔇'; };
  $('micBtn').onclick = toggleMic;
  $('bombBtn').onclick = bomb;

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'play' && !net.online) pause();
    last = performance.now();
  });

  persist();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
