<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#030712">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="screen-orientation" content="portrait">
<link rel="manifest" href="manifest.json">
<title>حرب الطائرات — الأساطير</title>
<style>
:root{
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --cyan: #00f0ff;
  --blue: #0077fe;
  --red: #ff1e56;
  --amber: #ffb703;
  --green: #00f59b;
  --panel-bg: rgba(6, 14, 30, 0.88);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;height:100%;overflow:hidden;
  background:#02050c;color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  touch-action:none;user-select:none;
}
#stage{
  position:absolute;overflow:hidden;
  left:50%;top:50%;transform:translate(-50%,-50%);
  background:#030814;
  box-shadow:0 0 70px rgba(0,240,255,0.2), inset 0 0 100px rgba(0,0,0,0.8);
}
canvas{display:block;width:100%;height:100%}

/* =========================================================
   HUD — واجهة قمرة القيادة المستقبلية
   ========================================================= */
#hud{
  position:absolute;inset:0 0 auto;
  padding:calc(var(--safe-top) + 12px) 12px 10px;
  pointer-events:none;
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:start;gap:8px;
  font-size:12px;font-weight:900;
  z-index:20;
}
.hud-col{display:flex;flex-direction:column;gap:6px}
.hud-col.center{align-items:center}
.hud-col.end{align-items:flex-end}

/* كبسولات المعلومات */
.gauge-box{
  background:var(--panel-bg);
  border:1px solid rgba(0,240,255,0.35);
  border-radius:14px;
  padding:6px 10px;
  backdrop-filter:blur(12px);
  box-shadow:0 4px 20px rgba(0,0,0,0.6), inset 0 0 12px rgba(0,240,255,0.08);
  display:flex;align-items:center;gap:8px;
  min-width:130px;
}
.gauge-bar-wrap{
  flex:1;height:8px;background:rgba(255,255,255,0.1);
  border-radius:6px;overflow:hidden;position:relative;
}
.gauge-bar{
  height:100%;width:100%;border-radius:6px;
  transition:width .2s cubic-bezier(0.2,0.8,0.2,1);
}
.gauge-bar.hp{background:linear-gradient(90deg, #ff1e56, #ff7536)}
.gauge-bar.shield{background:linear-gradient(90deg, #00f0ff, #0077fe)}
.gauge-bar.ally{background:linear-gradient(90deg, #00f59b, #00a8ff)}

.badge-pill{
  background:var(--panel-bg);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:12px;padding:5px 10px;
  font-size:11.5px;letter-spacing:.4px;
  backdrop-filter:blur(10px);
  display:flex;align-items:center;gap:6px;
}
.badge-pill.gold{border-color:rgba(255,183,3,0.4);color:#ffd56b}
.badge-pill.cyan{border-color:rgba(0,240,255,0.4);color:#92f6ff}
.badge-pill.ally-tag{border-color:rgba(0,245,155,0.4);color:#9effd3}

/* أزرار التحكم العلوي */
.hud-btn-group{display:flex;gap:6px;pointer-events:auto}
.hud-btn{
  background:linear-gradient(145deg, rgba(16,36,70,0.9), rgba(8,18,38,0.9));
  border:1px solid rgba(0,240,255,0.35);
  border-radius:12px;padding:8px 11px;font-size:16px;color:#fff;
  cursor:pointer;backdrop-filter:blur(10px);
  box-shadow:0 4px 15px rgba(0,0,0,0.5);
  transition:transform .12s, border-color .12s;
}
.hud-btn:active{transform:scale(0.9)}
#micBtn.on{
  background:linear-gradient(145deg, #059669, #022c22);
  border-color:#00f59b;
  box-shadow:0 0 16px rgba(0,245,155,0.6);
}

/* =========================================================
   شريط الزعيم والأسلحة والقنابل
   ========================================================= */
#bossBox{
  position:absolute;top:74px;left:8%;width:84%;
  background:rgba(20,5,15,0.85);
  border:1.5px solid rgba(255,30,86,0.6);
  border-radius:12px;padding:4px 6px;
  backdrop-filter:blur(10px);
  display:none;z-index:22;
  box-shadow:0 0 25px rgba(255,30,86,0.4);
}
#bossHeader{
  display:flex;justify-content:space-between;
  font-size:11px;font-weight:900;color:#ff92a8;margin-bottom:3px;padding:0 4px;
}
#bossBarInner{
  height:10px;background:rgba(0,0,0,0.5);
  border-radius:6px;overflow:hidden;
}
#bossFill{
  height:100%;width:100%;
  background:linear-gradient(90deg, #ff1e56, #ffb703);
  transition:width .12s linear;
}

#weaponbar{
  position:absolute;bottom:calc(var(--safe-bottom) + 12px);left:8px;right:8px;
  display:flex;justify-content:center;gap:6px;pointer-events:auto;z-index:22;
}
#weaponbar button{
  min-width:44px;flex:1;max-width:64px;padding:8px 2px;
  background:rgba(7,17,37,0.82);
  border:1px solid rgba(0,240,255,0.25);
  border-radius:14px;font-size:18px;color:#fff;
  backdrop-filter:blur(8px);cursor:pointer;
  transition:transform .12s, border-color .15s;
}
#weaponbar button.sel{
  border-color:var(--amber);
  background:linear-gradient(180deg, rgba(255,183,3,0.3), rgba(120,60,5,0.7));
  box-shadow:0 0 18px rgba(255,183,3,0.5);
}

#bombBtn{
  position:absolute;bottom:calc(var(--safe-bottom) + 82px);right:16px;
  width:62px;height:62px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #ff2a5f, #75031b);
  border:2.5px solid #ffa3b5;
  box-shadow:0 0 25px rgba(255,30,86,0.7), inset 0 0 10px rgba(255,255,255,0.4);
  font-size:25px;display:none;z-index:22;cursor:pointer;
}

/* =========================================================
   النوافذ المنبثقة والقوائم (Futuristic Modals)
   ========================================================= */
#overlay{
  position:absolute;inset:0;background:rgba(2,6,16,0.88);
  display:flex;justify-content:center;align-items:center;
  overflow:auto;padding:16px;backdrop-filter:blur(14px);z-index:40;
}
#overlay.hide{display:none}
.panel{
  width:100%;max-width:430px;max-height:92%;overflow:auto;
  background:linear-gradient(160deg, rgba(12,28,58,0.95), rgba(4,10,24,0.98));
  border:1.5px solid rgba(0,240,255,0.4);border-radius:26px;padding:22px;
  box-shadow:0 20px 70px rgba(0,0,0,0.9), 0 0 35px rgba(0,240,255,0.18);
  text-align:center;
}
.panel h1{
  font-size:27px;color:#92f6ff;margin:2px 0 14px;
  text-shadow:0 0 18px rgba(0,240,255,0.5);
}
.panel p{font-size:13.5px;line-height:1.8;color:#b9d5f5}
.big-btn{
  width:94%;padding:14px 20px;border-radius:16px;
  background:linear-gradient(100deg, #00b4d8, #5a189a);
  border:1px solid rgba(0,240,255,0.5);
  margin:8px auto;font-size:15px;font-weight:900;color:#fff;
  box-shadow:0 6px 20px rgba(0,180,216,0.35);
  cursor:pointer;display:block;
}
.big-btn.secondary{
  background:rgba(22,44,79,0.75);border-color:rgba(255,255,255,0.15);box-shadow:none;
}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.tabs button{
  padding:10px 14px;border-radius:12px;background:rgba(20,45,85,0.8);
  border:1px solid rgba(0,240,255,0.25);color:#fff;font-weight:800;cursor:pointer;
}
.card{
  display:flex;justify-content:space-between;align-items:center;text-align:right;gap:10px;
  background:rgba(14,32,64,0.65);border:1px solid rgba(0,240,255,0.2);
  border-radius:15px;padding:12px;margin:8px 0;font-size:13px;
}
.card button{
  background:linear-gradient(100deg,#0096c7,#0077b6);
  border:1px solid rgba(0,240,255,0.4);border-radius:10px;
  padding:9px 13px;min-width:88px;color:#fff;font-weight:800;cursor:pointer;
}
#toast{
  position:absolute;top:120px;left:8%;width:84%;text-align:center;
  font-weight:900;color:#ffd56b;
  text-shadow:0 2px 10px rgba(0,0,0,0.9), 0 0 15px rgba(255,213,107,0.6);
  pointer-events:none;opacity:0;transition:opacity .25s ease;
  z-index:30;font-size:15px;letter-spacing:.3px;
}
.roomcode{
  font-size:38px;letter-spacing:10px;color:var(--amber);font-weight:900;
  text-shadow:0 0 30px rgba(255,183,3,0.7);margin:10px 0;
}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800}
.badge.host{background:#047857;color:#a7f3d0}
.badge.guest{background:#b45309;color:#fde68a}
#remoteAudio{display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <!-- شاشة القيادة HUD -->
  <div id="hud">
    <!-- عمود الطيار الأساسي -->
    <div class="hud-col">
      <div class="gauge-box">
        <span style="font-size:14px">❤️</span>
        <div class="gauge-bar-wrap"><div class="gauge-bar hp" id="myHpFill"></div></div>
        <span id="myHpText">3/3</span>
      </div>
      <div class="gauge-box" style="border-color:rgba(0,119,254,0.35)">
        <span style="font-size:14px">🛡️</span>
        <div class="gauge-bar-wrap"><div class="gauge-bar shield" id="myShieldFill" style="width:0%"></div></div>
        <span id="shieldVal">0</span>
      </div>
      <div class="badge-pill gold">🪙 <span id="coins">0</span> | 🏆 <span id="score">0</span></div>
    </div>

    <!-- مركز الشاشة: المرحلة والمضاعف -->
    <div class="hud-col center">
      <div class="badge-pill cyan">🌍 <span id="world">1</span>/20 · <span id="levelHUD">1</span>/20</div>
      <div class="badge-pill" style="border-color:rgba(255,100,50,0.4);color:#ff8a65">🔥 ×<span id="combo">1</span></div>
    </div>

    <!-- عمود الحليف والأزرار -->
    <div class="hud-col end">
      <div class="hud-btn-group">
        <button class="hud-btn" id="pause">⏸</button>
        <button class="hud-btn" id="sound">🔊</button>
        <button class="hud-btn" id="micBtn" style="display:none">🎤</button>
      </div>

      <!-- بطاقة طائرة الحليف أثناء الأونلاين -->
      <div class="gauge-box" id="allyCard" style="display:none;border-color:rgba(0,245,155,0.4)">
        <span style="font-size:14px">🛰️</span>
        <div style="flex:1;display:grid;gap:2px">
          <div style="font-size:10px;color:#a7f3d0;display:flex;justify-content:space-between">
            <span id="allyName">حليف</span>
            <span id="allyPing">● متصل</span>
          </div>
          <div class="gauge-bar-wrap"><div class="gauge-bar ally" id="allyHpFill"></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- شريط الزعيم الفضائي -->
  <div id="bossBox">
    <div id="bossHeader">
      <span id="bossName">⚠️ زعيم المرحلة الكونية</span>
      <span id="bossHpPercent">100%</span>
    </div>
    <div id="bossBarInner"><div id="bossFill"></div></div>
  </div>

  <div id="toast"></div>
  <button id="bombBtn">💣</button>
  <div id="weaponbar"></div>

  <!-- النوافذ والشاشات -->
  <div id="overlay" class="hide">
    <div class="panel">
      <h1 id="heading">✈️ حرب الطائرات: الأساطير</h1>
      <div id="content"></div>
    </div>
  </div>
</div>
<audio id="remoteAudio" autoplay playsinline></audio>

<script>
(() => {
  'use strict';

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }

  const W = 480, H = 854, TAU = Math.PI * 2;
  const $ = id => document.getElementById(id);
  const cv = $('game'), ctx = cv.getContext('2d', { alpha: false }), stage = $('stage');
  const rnd = (a,b) => a + Math.random()*(b-a);
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

  let dpr = 1;
  function resize(){
    let s = Math.min(innerWidth/W, innerHeight/H);
    stage.style.width = W*s+'px';
    stage.style.height = H*s+'px';
    dpr = Math.min(devicePixelRatio || 1, 2.5);
    cv.width = W*dpr; cv.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
  }
  addEventListener('resize', resize); resize();

  function vibrate(ms=30){
    if ('vibrate' in navigator && save?.settings?.shake) {
      try { navigator.vibrate(ms); } catch(e){}
    }
  }

  /* الصور */
  const files = {
    player:'player.png', player2:'player2.png',
    grunt:'enemy_grunt.png', zig:'enemy_zig.png',
    tank:'enemy_tank.png', boss:'boss.png',
    bullet:'bullet.png', bullet2:'bullet2.png',
    ebullet:'ebullet.png', life:'powerup_life.png',
    power:'powerup_power.png', background:'background.png'
  };
  const imgs = {}; let imgLoadedCount = 0;
  const imgTotal = Object.keys(files).length;
  let allImgsReady = false;

  for (const [k,v] of Object.entries(files)) {
    const im = new Image();
    im.onload = () => { im.ok = true; onImgLoad(); };
    im.onerror = () => { im.ok = false; onImgLoad(); };
    im.src = 'images/'+v; imgs[k] = im;
  }
  function onImgLoad(){ if (++imgLoadedCount >= imgTotal) allImgsReady = true; }

  function pic(k, x, y, w, h, rot=0){
    const im = imgs[k];
    if (!im?.ok) return false;
    const ratio = im.naturalWidth / im.naturalHeight;
    if (w/h > ratio) w = h*ratio; else h = w/ratio;
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
    ctx.drawImage(im, -w/2, -h/2, w, h); ctx.restore();
    return true;
  }

  const WEAP = [
    ['🔫','رشاش البلازما','machine'],
    ['🚀','صواريخ التتبع','missile'],
    ['⚡','شعاع الليزر','laser'],
    ['💣','القنبلة التكتيكية','bomb'],
    ['🔥','القاذف الناري','fire'],
    ['🌪️','الدرع الدائري','radial']
  ];
  const WORLD_NAMES = [
    'سماء العاصمة','الصحراء الحربية','المحيط المظلم','الجبال الثلجية','الغابة الكونية',
    'المدينة المدمرة','المنطقة البركانية','حزام الكويكبات','قاعدة السايبر','العاصفة النجمية',
    'سماء الشفق','الجزر العائمة','ممر النيازك','أعماق الماغما','الصحراء النيونية',
    'القلب الجليدي','المجرة الأرجوانية','حصن الحديد','بوابة الظلال','المعركة النهائية'
  ];
  const WORLD_PALETTE = [
    ['#040a18','#0a2347'],['#1e1022','#784318'],['#03142c','#064975'],['#0c1b30','#3a708c'],
    ['#041a14','#164c39'],['#1c1017','#5c352d'],['#1c060e','#852711'],['#050414','#2a0e52'],
    ['#0a1420','#2d445b'],['#1a0624','#54143a']
  ];
  const WORLD_THEMES = Array.from({length:20},(_,i)=>{
    const b = WORLD_PALETTE[i % WORLD_PALETTE.length];
    return [WORLD_NAMES[i], b[0], b[1]];
  });
  const today = () => new Date().toLocaleDateString('en-CA');

  let save = {
    coins:0, best:0, unlocked:[0], playerName:'كابتن',
    upgrades:{damage:0, armor:0, magnet:0},
    missions:{date:today(), kills:0, bosses:0, earned:0, claimed:[false,false,false]},
    progress:0, settings:{sound:true, volume:75, particles:'high', shake:true, stars:true, controls:'normal'}
  };
  try {
    const old = JSON.parse(localStorage.getItem('airLegendsSave')||'null');
    if (old) save = {...save, ...old,
      upgrades:{...save.upgrades, ...old.upgrades},
      missions:{...save.missions, ...old.missions},
      settings:{...save.settings, ...(old.settings||{})}};
  } catch(e){}
  if (save.missions.date !== today()) save.missions = {date:today(),kills:0,bosses:0,earned:0,claimed:[false,false,false]};
  const persist = () => { try { localStorage.setItem('airLegendsSave', JSON.stringify(save)); } catch(e){} };

  let selectedLevel = Math.min(399, save.progress);
  let level = 1, worldIndex = 0, levelDuration = 28;
  let state = 'menu', score = 0, earned = 0, kills = 0, world = 1;
  let time = 0, spawn = 0, bossActive = false, bossDone = false;
  let shake = 0, combo = 1, comboTime = 0, slow = 0;
  let toastTime = 0, shotId = 0, weapon = 0, localEid = 0;
  let sound = save.settings.sound;
  let audio = null;

  let enemies = [], shots = [], bad = [], drops = [], particles = [], shockwaves = [];
  const remoteShots = [];

  const starLayers = [
    Array.from({length:35}, () => ({x:rnd(0,W), y:rnd(0,H), s:rnd(0.6,1.2), v:45, a:rnd(0.2,0.5)})),
    Array.from({length:35}, () => ({x:rnd(0,W), y:rnd(0,H), s:rnd(1.4,2.2), v:95, a:rnd(0.5,0.8)})),
    Array.from({length:20}, () => ({x:rnd(0,W), y:rnd(0,H), s:rnd(2.5,3.6), v:160, a:1.0}))
  ];

  const player = {
    x:W/2, y:H-160, tx:W/2, ty:H-160, tilt:0,
    hp:3, maxHp:3, inv:0, shield:0, power:1, fire:0, bombs:2, alive:true
  };

  /* =========================================================
     ★★★ محرك الشبكة فائق السلاسة (Smooth Multiplayer Engine) ★★★
     ========================================================= */
  const net = {
    ws: null, connected: false, roomCode: '', myId: '', hostId: '', host: false,
    players: new Map(), online: false, sendT: 0, pendingBullets: [], lastHurtSent: 0
  };

  function netConnect(cb){
    if (net.ws && net.ws.readyState === WebSocket.OPEN) return cb && cb();
    const q = new URLSearchParams(location.search).get('server');
    let url;
    if (q) url = q.startsWith('ws') ? q : `ws://${q}`;
    else url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;

    net.ws = new WebSocket(url);
    net.ws.onopen = () => { net.connected = true; cb && cb(); };
    net.ws.onclose = () => {
      net.connected = false;
      if (net.online){ net.online = false; cleanupRTC(); toast('⚠️ انقطع الاتصال بالخادم'); main(); }
    };
    net.ws.onerror = () => toast('❌ تعذر الاتصال بالسيرفر');
    net.ws.onmessage = e => { try { handleNet(JSON.parse(e.data)); } catch(err){} };
  }
  function netSend(o){ if (net.ws && net.ws.readyState === 1) net.ws.send(JSON.stringify(o)); }

  function handleNet(m){
    switch(m.t){
      case 'joined':
        net.roomCode = m.code; net.myId = m.id; net.hostId = m.hostId;
        net.host = m.hostId === m.id;
        net.players.clear();
        m.players.forEach(p => {
          net.players.set(p.id, {
            id: p.id, x: W/2, y: H-160, tx: W/2, ty: H-160,
            tilt: 0, hp: 3, maxHp: 3, alive: true, name: p.name || 'حليف'
          });
        });
        updateMicUI(); lobbyScreen(); break;

      case 'lobby':
        m.players.forEach(p => {
          let cur = net.players.get(p.id);
          if (!cur) {
            net.players.set(p.id, {
              id: p.id, x: W/2, y: H-160, tx: W/2, ty: H-160,
              tilt: 0, hp: 3, maxHp: 3, alive: true, name: p.name || 'حليف'
            });
          } else cur.name = p.name || cur.name;
        });
        net.hostId = m.host; net.host = m.host === net.myId;
        if (state === 'lobby') lobbyScreen(); break;

      case 'start': startOnline(m.levelIndex); break;
      case 'S': applySnapshot(m); break;
      case 'shoot': onRemoteShoot(m); break;
      case 'kill': onKill(m.id); break;
      case 'hp': onHpMsg(m); break;
      case 'boss': bossActive = true; toast('⚠️ استعد.. الزعيم يهاجم!'); break;
      case 'over': finishOnline(!!m.win); break;
      case 'left':
        net.players.delete(m.id);
        if (state === 'play' || state === 'lobby') toast('🚪 غادر أحد الحلفاء');
        cleanupRTC(); break;
      case 'err': toast(m.msg); break;
      case 'rtc-desc': handleRTCDesc(m); break;
      case 'rtc-ice':  handleRTCIce(m);  break;
    }
  }

  /* تطبيق بيانات السيرفر بدون إعادة بناء الكائنات (منع القفزات والتقطيع) */
  function applySnapshot(m){
    const seen = new Set();
    for (const [id,type,x,y,hp,max,r] of m.enemies){
      seen.add(id);
      let e = enemies.find(v => v.id === id);
      if (!e){
        enemies.push({ id, type, x, y, tx:x, ty:y, hp, max, r, t:0, dir:1,
          flash:0, score: type==='boss'?300 : type==='tank'?35 : 15 });
      } else { e.tx = x; e.ty = y; e.hp = hp; e.max = max; }
    }
    for (let i = enemies.length-1; i>=0; i--) if (!seen.has(enemies[i].id)) enemies.splice(i,1);

    const ebSeen = new Set();
    for (const [id,x,y,vx,vy] of m.eb){
      ebSeen.add(id);
      let b = bad.find(v => v.id === id);
      if (!b) bad.push({ id, x, y, vx, vy, r:7 });
      else { b.x += (x-b.x)*0.45; b.y += (y-b.y)*0.45; b.vx = vx; b.vy = vy; }
    }
    for (let i = bad.length-1; i>=0; i--) if (!ebSeen.has(bad[i].id)) bad.splice(i,1);

    /* استيفاء وتحديث مواقع طائرات اللاعبين بنعومة تامة */
    const currentActiveIds = new Set();
    for (const [id, x, y, hp, alive, name] of m.players){
      currentActiveIds.add(id);
      let p = net.players.get(id);
      if (!p){
        p = { id, x, y, tx:x, ty:y, tilt:0, hp, maxHp:hp, alive:!!alive, name: name || 'حليف' };
        net.players.set(id, p);
      } else {
        p.tx = x;
        p.ty = y;
        p.hp = hp;
        p.alive = !!alive;
        if (name) p.name = name;
      }
    }
    for (const [id] of net.players){
      if (!currentActiveIds.has(id) && id !== net.myId) net.players.delete(id);
    }

    const me = net.players.get(net.myId);
    if (me){
      player.hp = me.hp;
      if (me.alive !== player.alive){
        player.alive = me.alive;
        if (me.alive){ player.inv = 2; toast('✨ عدت للمعركة!'); }
        else toast('💀 ستعود خلال 6 ثوانٍ...');
      }
    }
  }

  function tone(f=440, d=.08){
    if (!sound) return;
    try {
      audio ??= new (window.AudioContext||window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(f, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(30, f*0.3), t+d);
      g.gain.setValueAtTime(0.04 * (save.settings.volume/100), t);
      g.gain.exponentialRampToValueAtTime(0.0001, t+d);
      o.connect(g); g.connect(audio.destination);
      o.start(t); o.stop(t+d);
    } catch(e){}
  }

  const ICE_SERVERS = [
    { urls: 'stun:stun.l.google.com:19302' },

  function ensurePC(){
    if (peerConn) return;
    peerConn = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    peerConn.onicecandidate = ({ candidate }) => {
      if (candidate) netSend({ t:'rtc-ice', cand: candidate });
    };
    peerConn.ontrack = ({ streams: [stream] }) => {
      remoteAudio.srcObject = stream;
      remoteAudio.play().catch(()=>{});
      toast('🔊 الصوت متصل مباشرة');
    };
    peerConn.onnegotiationneeded = async () => {
      try {
        makingOffer = true;
        await peerConn.setLocalDescription();
        netSend({ t:'rtc-desc', desc: peerConn.localDescription });
      } catch (e) { console.error(e); }
      finally { makingOffer = false; }
    };
  }

  async function handleRTCDesc(m){
    ensurePC();
    const readyForOffer = !makingOffer && (peerConn.signalingState === 'stable' || isSettingRemoteAnswerPending);
    const offerCollision = m.desc.type === 'offer' && !readyForOffer;
    ignoreOffer = !polite() && offerCollision;
    if (ignoreOffer) return;
    isSettingRemoteAnswerPending = m.desc.type === 'answer';
    await peerConn.setRemoteDescription(m.desc);
    isSettingRemoteAnswerPending = false;
    if (m.desc.type === 'offer'){
      await peerConn.setLocalDescription();
      netSend({ t:'rtc-desc', desc: peerConn.localDescription });
    }
  }

  async function handleRTCIce(m){
    if (!peerConn) return;
    try { await peerConn.addIceCandidate(m.cand); } catch(e){}
  }

      updateMicUI(); return;
    }
    try {
      micOn = true; updateMicUI();
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
      ensurePC();
      for (const t of localStream.getTracks()) peerConn.addTrack(t, localStream);
      toast('🎙️ الميكروفون نشط');
    } catch(err){
      toast('❌ الميكروفون غير متاح');

  }

    html += '<h3 style="color:#92f6ff;margin-top:16px">🔓 ترسانة الأسلحة المتطورة</h3>';
    for (let i = 1; i < WEAP.length; i++){
      const w = WEAP[i], cost = i*180;
      html += `<div class="card"><div><b>${w[0]} ${w[1]}</b></div>
        <button data-weapon="${i}" ${save.unlocked.includes(i)||save.coins<cost?'disabled':''}>${save.unlocked.includes(i)?'مجهز':'🪙 '+cost}</button></div>`;
    }
    html += '<button class="big-btn secondary" id="back" style="margin-top:14px">↩ رجوع</button>';
    menu('🛒 ترسانة التطوير', html);
    $('back').onclick = main;
    document.querySelectorAll('[data-up]').forEach(b => b.onclick = () => {
      const k = b.dataset.up, lv = save.upgrades[k];
      const base = {damage:120,armor:150,magnet:100}[k], cost = base*(lv+1);
      if (lv<5 && save.coins>=cost){ save.coins -= cost; save.upgrades[k]++; persist(); shop(); }
    });
    document.querySelectorAll('[data-weapon]').forEach(b => b.onclick = () => {
      const i = +b.dataset.weapon, cost = i*180;
      if (save.coins>=cost && !save.unlocked.includes(i)){ save.coins -= cost; save.unlocked.push(i); persist(); shop(); }
    });
  }

  function tasks(){
    const m = save.missions;
    const arr = [['تدمير 50 طائرة معادية', m.kills, 50, 100],['قهر 2 من الزعماء الكبار', m.bosses, 2, 160],['جمع 150 مكعب طاقة', m.earned, 150, 120]];
    let html = '<p>المهام تتجدد يومياً تلقائياً.</p>';
    arr.forEach((a,i)=> html += `<div class="card"><div><b>${a[0]}</b>
      <small style="display:block;color:#9bb8d6">${Math.min(a[1],a[2])}/${a[2]} — الجائزة: 🪙 ${a[3]}</small></div>
      <button data-claim="${i}" ${a[1]<a[2]||m.claimed[i]?'disabled':''}>${m.claimed[i]?'تمت المطالبة':'استلام'}</button></div>`);
    html += '<button class="big-btn secondary" id="back" style="margin-top:14px">↩ رجوع</button>';
    menu('📅 المهام اليومية', html);
    $('back').onclick = main;
    document.querySelectorAll('[data-claim]').forEach(b => b.onclick = () => {
      const i = +b.dataset.claim;
      if (!m.claimed[i] && arr[i][1] >= arr[i][2]){ m.claimed[i] = true; save.coins += arr[i][3]; persist(); tasks(); }
    });
  }

  function buildBar(){
    const el = $('weaponbar'); el.innerHTML = '';
    save.unlocked.sort((a,b)=>a-b).forEach(i => {
      const b = document.createElement('button');
      b.textContent = WEAP[i][0]; b.title = WEAP[i][1];
      b.className = weapon === i ? 'sel' : '';
      b.onclick = () => { weapon = i; buildBar(); toast(WEAP[i][0]+' '+WEAP[i][1]); };
      el.appendChild(b);
    });
  }

  function start(index = selectedLevel){
    if (index > save.progress || index < 0 || index >= 400) return;
    net.online = false; selectedLevel = index;
    world = Math.floor(index/20)+1; worldIndex = world-1;
    level = index%20+1;
    levelDuration = 24 + level*1.1 + Math.floor(index/40)*2;
    state = 'play';
    score = earned = kills = time = 0;
    spawn = .6; bossActive = bossDone = false;
    shake = 0; combo = 1; comboTime = 0; slow = 0; weapon = 0;
    enemies = []; shots = []; bad = []; drops = []; particles = []; shockwaves = [];
    remoteShots.length = 0;
    Object.assign(player, { x:W/2, y:H-160, tx:W/2, ty:H-160, tilt:0,
      maxHp:3+save.upgrades.armor, hp:3+save.upgrades.armor,
      inv:2, shield:0, power:1, fire:0, bombs:2, alive:true });
    $('overlay').classList.add('hide');
    buildBar(); hud(); updateMicUI();
    toast('🌍 ' + WORLD_NAMES[worldIndex] + ' · المرحلة ' + level);
  }

  function pause(){
    if (state !== 'play') return;
    state = 'pause';
    menu('⏸ استراحة محارب', `
      <p>النقاط: ${score} · 🌍 ${world} · المرحلة ${level}</p>
      <button class="big-btn" id="resume">▶ متابعة القتال</button>
      <button class="big-btn secondary" id="quit">${net.online?'🚪 مغادرة الغرفة':'🏠 القائمة الرئيسية'}</button>
    `);
    state = 'pause';
    $('resume').onclick = () => { state = 'play'; $('overlay').classList.add('hide'); hud(); };
    $('quit').onclick = () => {
      save.best = Math.max(save.best, score); persist();
      if (net.online){ cleanupRTC(); netSend({t:'leave'}); net.online = false; try { net.ws.close(); } catch(e){} }
      main();
    };
  }

  function finish(win){
    if (state === 'over') return;
    state = 'over';
    save.best = Math.max(save.best, score);
    if (win && selectedLevel === save.progress){
      save.progress = Math.min(400, save.progress+1);
      gain(40 + world*8 + level*4);
    }
    persist();
    menu(win?'🏆 تم إنجاز المهمة بنجاح!':'💥 تحطمت الطائرة', `
      <p>🌍 ${WORLD_NAMES[worldIndex]} · المرحلة ${level}/20<br>
      النقاط المحققة: <b>${score}</b> | 🪙 المكافأة: ${earned}<br>الطائرات الساقطة: ${kills}</p>
      <button class="big-btn" id="again">${win && selectedLevel<399?'▶ المرحلة التالية':'🔄 المحاولة مجدداً'}</button>
      <button class="big-btn secondary" id="levels">🗺️ قائمة المراحل</button>
      <button class="big-btn secondary" id="home">🏠 الرئيسية</button>
    `);
    state = 'over';
    $('again').onclick = () => start(win && selectedLevel<399 ? selectedLevel+1 : selectedLevel);
    $('levels').onclick = () => levelSelect(worldIndex);
    $('home').onclick = main;
  }

  function gain(n){ save.coins += n; earned += n; save.missions.earned += n; persist(); }

  function addShockwave(x, y, maxR=60, color='#00f0ff'){
    shockwaves.push({ x, y, r:4, maxR, color, alpha:1 });
  }

  function burst(x, y, color, n=20){
    const mult = {low:0.35, medium:0.8, high:1.4}[save.settings.particles] || 1.2;
    n = Math.round(n * mult);
    for (let i = 0; i < n && particles.length < 500; i++){
      const a = rnd(0, TAU), v = rnd(50, 260), life = rnd(0.25, 0.7);
      particles.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life, max:life, color, r:rnd(1.5, 4.5) });
    }
  }

  function addThrusterParticles(x, y, color1='#00f0ff', color2='#ff7536'){
    if (save.settings.particles === 'low') return;
    particles.push({
      x: x + rnd(-3, 3), y: y + 26,
      vx: rnd(-15, 15), vy: rnd(140, 260),
      life: 0.18, max: 0.18, color: Math.random() > 0.4 ? color1 : color2,
      r: rnd(2, 4.5)
    });
  }

  function addShot(x,y,vx,vy,damage=1,kind='machine',r=5){
    shots.push({id:++shotId,x,y,vx,vy,damage,kind,r,hit:new Set(),life:2.5});
  }

  function nearest(x,y){
    let best = null, d = Infinity;
    for (const e of enemies){
      const z = (e.x-x)**2 + (e.y-y)**2;
      if (z < d){ d = z; best = e; }
    }
    return best;
  }

  function fire(){
    const x = player.x, y = player.y - 28;
    const damage = 1 + save.upgrades.damage*0.35;
    const extra = player.power - 1;
    const newBullets = [];

    if (weapon === 0) {
      for (let i = -extra; i <= extra; i++)
        newBullets.push({x:x+i*10, y, vx:i*30, vy:-950, dmg:damage, kind:'machine', r:5});
    } else if (weapon === 1) {
      for (let i = 0; i < 1+Math.floor(extra/2); i++)
        newBullets.push({x:x+(i-0.5)*20, y, vx:0, vy:-520, dmg:damage*3, kind:'missile', r:9});
    } else if (weapon === 2) {
      newBullets.push({x, y, vx:0, vy:-1250, dmg:damage*1.4, kind:'laser', r:12});
    } else if (weapon === 4) {
      for (let i = -1-extra; i <= 1+extra; i++)
        newBullets.push({x:x+i*7, y, vx:i*65, vy:-750, dmg:damage*1.5, kind:'fire', r:8});
    } else if (weapon === 5) {
      const n = 12 + extra*2;
      for (let i = 0; i < n; i++){
        const a = TAU*i/n;
        newBullets.push({x, y, vx:Math.cos(a)*620, vy:Math.sin(a)*620, dmg:damage, kind:'radial', r:5});
      }
    }

    for (const b of newBullets) addShot(b.x, b.y, b.vx, b.vy, b.dmg, b.kind, b.r);

    if (net.online){
      for (const b of newBullets) net.pendingBullets.push({ x:b.x, y:b.y, vx:b.vx, vy:b.vy, kind:b.kind, r:b.r });
      if (net.pendingBullets.length > 200) net.pendingBullets.splice(0, net.pendingBullets.length - 200);
    }
    tone(weapon===1?300:920, .035);
  }

  function bomb(){
    if (state !== 'play' || player.bombs <= 0 || !player.alive) return;
    player.bombs--; bad = []; shake = 24; vibrate(120);
    addShockwave(player.x, player.y, 250, '#ffb703');
    burst(player.x, player.y, '#ffffff', 90);
    if (net.online){
      for (const e of enemies) netSend({ t:'hit', id:e.id, dmg: e.type==='boss'?14:100 });
    } else {
      for (let i = enemies.length-1; i >= 0; i--){
        const e = enemies[i]; e.hp -= e.type==='boss' ? 40 : 100;
        if (e.hp <= 0) kill(i);
      }
    }
    tone(80, .7); hud();
  }

  function enemySpawn(){
    const difficulty = 1 + selectedLevel*.022;
    const pattern = (level+world)%5;
    const roll = Math.random();
    const type = roll < Math.min(.48, .08+difficulty*.065+(pattern===2?.12:0)) ? 'tank'
               : roll < (.52+(pattern===1?.18:0)) ? 'zig' : 'grunt';
    const r = type==='tank'?26:20;
    const hp = type==='tank'?Math.ceil(4+difficulty*2.2)
             : type==='zig'?Math.ceil(1+difficulty*.8)
             : Math.ceil(difficulty*.48);
    enemies.push({
      id: 'L'+(++localEid), type, x:rnd(40,W-40), y:-55, r, hp, max:hp,
      vy: (type==='tank'?75:130) + Math.min(220, difficulty*18),
      fire: rnd(1,2.5), t:0, dir:1, score: type==='tank'?35:15
    });
  }

  function boss(){
    bossActive = true;
    const hp = Math.ceil(42 + selectedLevel*2.5 + level*3.8);
    enemies.push({ id:'B'+(++localEid), type:'boss', x:W/2, y:-120, r:64, hp, max:hp,
      vy:0, fire:1.4, t:0, dir:1, enter:true, score:300+world*100 });
    toast('⚠️ تحذير: ظهر زعيم العالم ' + world + '!');
    tone(110, .6); vibrate(80);
  }

  function kill(i){
    const e = enemies[i]; if (!e) return;
    enemies.splice(i,1);
    score += e.score*combo;
    combo = Math.min(9, combo+1); comboTime = 3;
    shake = Math.max(shake, e.type==='boss'?18:5);
    vibrate(e.type==='boss'?80:30);
    addShockwave(e.x, e.y, e.type==='boss'?90:35, '#00f0ff');
    burst(e.x, e.y, e.type==='boss'?'#ffb703':'#ff1e56', e.type==='boss'?70:22);
    if (e.type === 'boss'){
      bossActive = false; bossDone = true;
      save.missions.bosses++; gain(100+world*20);
      toast('🏆 تم تحييد زعيم العالم ' + world);
      for (let j = 0; j < 3; j++) drops.push({x:e.x+rnd(-50,50), y:e.y, kind:j===0?'life':j===1?'power':'bomb', t:0});
    } else {
      kills++; save.missions.kills++; gain(2+world);
      if (Math.random() < .13) drops.push({x:e.x, y:e.y, kind:['power','life','shield','slow','bomb'][Math.floor(rnd(0,5))], t:0});
    }
    persist();
  }

  function hurt(){
    if (!player.alive || player.inv > 0) return;
    if (player.shield > 0){
      player.shield = Math.max(0, player.shield-2);
      player.inv = 0.4; tone(800, .05); vibrate(30); return;
    }
    player.hp--; player.inv = 2.2; combo = 1; shake = 15; vibrate(70);
    addShockwave(player.x, player.y, 45, '#ff1e56');
    burst(player.x, player.y, '#00f0ff', 30);
    tone(150, .35);
    if (player.hp <= 0) finish(false);
  }

  function aimed(x,y,s=240){
    const dx = player.x-x, dy = player.y-y, L = Math.hypot(dx,dy)||1;
    bad.push({ id:'e'+Math.random(), x, y, vx:dx/L*s, vy:dy/L*s, r:7.5 });
  }

  /* =========================================================
     تحديث الفيزياء وحركة اللاعبين في الأونلاين (Buttery Smooth)
     ========================================================= */
  function update(dt){
    const ds = dt/1000;
    time += ds; toastTime -= ds;
    if (toastTime <= 0) $('toast').style.opacity = 0;

    player.inv = Math.max(0, player.inv - ds);
    player.shield = Math.max(0, player.shield - ds);
    slow = Math.max(0, slow - ds);
    comboTime -= ds;
    if (comboTime <= 0) combo = 1;

    /* تحديث حركة طيارتك المحلية */
    if (player.alive){
      const keySpeed = 680 * ds;
      if (keys.ArrowLeft  || keys.KeyA) player.tx -= keySpeed;
      if (keys.ArrowRight || keys.KeyD) player.tx += keySpeed;
      if (keys.ArrowUp    || keys.KeyW) player.ty -= keySpeed;
      if (keys.ArrowDown  || keys.KeyS) player.ty += keySpeed;

      player.tx = clamp(player.tx, 25, W-25);
      player.ty = clamp(player.ty, 60, H-60);

      const prevX = player.x;
      const k = 1 - Math.exp(-38 * ds);
      player.x += (player.tx - player.x) * k;
      player.y += (player.ty - player.y) * k;

      const deltaX = (player.x - prevX);
      const targetTilt = clamp(deltaX * 0.045, -0.28, 0.28);
      player.tilt += (targetTilt - player.tilt) * (1 - Math.exp(-22 * ds));

      addThrusterParticles(player.x - 14, player.y, '#00f0ff', '#0077fe');
      addThrusterParticles(player.x + 14, player.y, '#00f0ff', '#0077fe');

      player.fire -= ds;
      if (player.fire <= 0){
        fire();
        player.fire = [.11,.42,.11,.9,.22,.50][weapon];
      }
    }

    /* موجات الصدمة */
    for (let i = shockwaves.length - 1; i >= 0; i--){
      const sw = shockwaves[i];
      sw.r += (sw.maxR - sw.r) * (ds * 9);
      sw.alpha -= ds * 1.8;
      if (sw.alpha <= 0.05) shockwaves.splice(i, 1);
    }

    /* استيفاء حركة طائرة الصديق في الأونلاين (بدون لاج) */
    if (net.online){
      for (const [id, p] of net.players){
        if (id === net.myId || !p.alive) continue;
        const prevAllyX = p.x;
        const interpK = 1 - Math.exp(-26 * ds);
        p.x += (p.tx - p.x) * interpK;
        p.y += (p.ty - p.y) * interpK;

        /* إمالة وانعطاف طائرة الصديق */
        const allyDeltaX = p.x - prevAllyX;
        const allyTargetTilt = clamp(allyDeltaX * 0.045, -0.28, 0.28);
        p.tilt = (p.tilt || 0) + (allyTargetTilt - (p.tilt || 0)) * (1 - Math.exp(-20 * ds));

        /* عوادم نفاثة واقعية لطائرة الصديق */
        addThrusterParticles(p.x - 14, p.y, '#ff1e56', '#ff7536');
        addThrusterParticles(p.x + 14, p.y, '#ff1e56', '#ff7536');
      }

      for (const e of enemies){
        e.x += (e.tx - e.x)*Math.min(1, ds*16);
        e.y += (e.ty - e.y)*Math.min(1, ds*16);
        e.t += ds; if (e.flash > 0) e.flash -= ds;
      }
      for (let i = bad.length-1; i >= 0; i--){
        const b = bad[i];
        b.x += b.vx*ds; b.y += b.vy*ds;
        if (b.y > H+50 || b.y < -50 || b.x < -50 || b.x > W+50){ bad.splice(i,1); continue; }
        if (player.alive && Math.hypot(b.x-player.x, b.y-player.y) < b.r+13){ bad.splice(i,1); netHurt(); }
      }
      if (player.alive) for (const e of enemies){
        if (Math.hypot(e.x-player.x, e.y-player.y) < e.r*.7 + 13) netHurt();
      }
      for (let i = remoteShots.length-1; i >= 0; i--){
        const b = remoteShots[i];
        b.life -= ds;
        b.x += b.vx*ds; b.y += b.vy*ds;
        if (b.life <= 0 || b.y < -50 || b.y > H+50) remoteShots.splice(i,1);
      }

      /* إرسال موقع اللاعب بسرعة فائقة (كل 45ms) لدقة لا متناهية */
      net.sendT -= ds;
      if (net.sendT <= 0){
        net.sendT = 0.045;
        const msg = { t:'p', x:Math.round(player.x), y:Math.round(player.y) };
        if (net.pendingBullets.length){ msg.shoot = net.pendingBullets; net.pendingBullets = []; }
        netSend(msg);
      }
    } else {
      if (!bossActive && !bossDone && time >= levelDuration) boss();
      if (bossDone){ finish(true); return; }
      if (!bossActive){
        spawn -= ds;
        if (spawn <= 0){
          enemySpawn();
          spawn = Math.max(.22, 1.1 - selectedLevel*.0021) * rnd(.7,1.25);
        }
      }
      const factor = slow > 0 ? .45 : 1;
      for (let i = enemies.length-1; i >= 0; i--){
        const e = enemies[i];
        e.t += ds;
        if (e.type === 'boss'){
          if (e.enter){ e.y += 95*ds; if (e.y >= 135){ e.y = 135; e.enter = false; } }
          else {
            e.x += e.dir*(85+world*9)*ds*factor;
            if (e.x < 75 || e.x > W-75) e.dir *= -1;
            e.fire -= ds*factor;
            if (e.fire <= 0){
              e.fire = Math.max(.65, 1.5 - world*.07);
              for (let j = 0; j < 7; j++){
                const a = Math.PI*(.1 + j*.8/6);
                bad.push({id:'e'+Math.random(), x:e.x, y:e.y+35, vx:Math.cos(a)*230, vy:Math.sin(a)*230, r:7});
              }
              aimed(e.x, e.y+32, 250 + world*8);
            }
          }
        } else {
          e.y += e.vy*ds*factor;
          if (e.type === 'zig') e.x = clamp(e.x + Math.sin(e.t*5.5)*160*ds, 25, W-25);
          if (e.type === 'tank'){
            e.fire -= ds*factor;
            if (e.fire <= 0 && e.y > 20){ e.fire = 1.4; aimed(e.x, e.y); }
          }
        }
        if (e.y > H+65){ enemies.splice(i,1); continue; }
        if (Math.hypot(e.x-player.x, e.y-player.y) < e.r*.7 + 13){
          if (e.type !== 'boss'){ enemies.splice(i,1); burst(e.x, e.y, '#ff7536', 16); }
          hurt();
        }
      }
      for (let i = bad.length-1; i >= 0; i--){
        const b = bad[i];
        b.x += b.vx*ds; b.y += b.vy*ds;
        if (b.y > H+40 || b.y < -40 || b.x < -40 || b.x > W+40){ bad.splice(i,1); continue; }
        if (Math.hypot(b.x-player.x, b.y-player.y) < b.r+12){ bad.splice(i,1); hurt(); }
      }
    }

    /* طلقات اللاعب واصطداماتها */
    for (let i = shots.length-1; i >= 0; i--){
      const b = shots[i];
      b.life -= ds;
      if (b.kind === 'missile'){
        const t = nearest(b.x, b.y);
        if (t){
          const dx = t.x-b.x, dy = t.y-b.y, d = Math.hypot(dx,dy)||1;
          b.vx += (dx/d*620 - b.vx)*Math.min(1,ds*5);
          b.vy += (dy/d*620 - b.vy)*Math.min(1,ds*5);
        }
      }
      b.x += b.vx*ds; b.y += b.vy*ds;
      if (b.life <= 0 || b.y < -45 || b.y > H+40 || b.x < -45 || b.x > W+45){ shots.splice(i,1); continue; }

      let removed = false;
      for (let j = enemies.length-1; j >= 0; j--){
        const e = enemies[j];
        if (b.hit.has(e.id)) continue;
        if (Math.hypot(e.x-b.x, e.y-b.y) < e.r + b.r){
          b.hit.add(e.id);
          burst(b.x, b.y, '#00f0ff', 4);
          if (net.online){
            e.flash = 0.12; netSend({ t:'hit', id:e.id, dmg:b.damage });
          } else {
            e.hp -= b.damage; if (e.hp <= 0) kill(j);
          }
          if (b.kind !== 'laser'){ shots.splice(i,1); removed = true; }
          break;
        }
      }
      if (removed) continue;
    }

    for (let i = drops.length-1; i >= 0; i--){
      const a = drops[i];
      a.t += ds; a.y += 105*ds;
      a.x += Math.sin(a.t*4)*25*ds;
      if (a.y > H+30){ drops.splice(i,1); continue; }
      if (Math.hypot(a.x-player.x, a.y-player.y) < 35 + save.upgrades.magnet*14){
        drops.splice(i,1);
        if (a.kind === 'life')   player.hp = Math.min(player.maxHp, player.hp+1);
        if (a.kind === 'power')  player.power = Math.min(3, player.power+1);
        if (a.kind === 'shield') player.shield = 9;
        if (a.kind === 'slow')   slow = 7;
        if (a.kind === 'bomb')   player.bombs = Math.min(5, player.bombs+1);
        gain(8); vibrate(25);
        toast({life:'❤️ تعزيز صحة', power:'⚡ ترقية النيران', shield:'🛡️ درع بلازمي', slow:'❄️ تجميد زمني', bomb:'💣 قنبلة ذكية'}[a.kind]);
        tone(1150, .14);
      }
    }

    for (let i = particles.length-1; i >= 0; i--){
      const a = particles[i];
      a.life -= ds; a.x += a.vx*ds; a.y += a.vy*ds;
      a.vx *= 0.96; a.vy *= 0.96;
      if (a.life <= 0) particles.splice(i,1);
    }
    for (const layer of starLayers){
      for (const s of layer){
        s.y += s.v * ds;
        if (s.y > H){ s.y = 0; s.x = rnd(0, W); }
      }
    }

    hud();
  }

  /* رندرة الجرافيكس المطور */
  let bgCache = null, bgCacheWorld = -1;
  function getBg(){
    if (bgCacheWorld === world && bgCache) return bgCache;
    const theme = WORLD_THEMES[world-1];
    const bg = ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0, theme[1]);
    bg.addColorStop(1, theme[2]);
    bgCache = bg; bgCacheWorld = world;
    return bg;
  }

  function render(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle = getBg();
    ctx.fillRect(0,0,W,H);

    if (imgs.background?.ok) {
      ctx.globalAlpha = 0.85;
      pic('background', W/2, H/2, W, H);
      ctx.globalAlpha = 1.0;
    }

    ctx.save();
    if (save.settings.shake && shake > 0.2){
      ctx.translate(rnd(-shake,shake), rnd(-shake,shake));
      shake *= 0.88;
    }

    for (const layer of starLayers){
      for (const s of layer){
        ctx.fillStyle = '#bce6ff';
        ctx.globalAlpha = s.a;
        ctx.fillRect(s.x, s.y, s.s, s.s*1.6);
      }
    }
    ctx.globalAlpha = 1.0;

    for (const sw of shockwaves){
      ctx.save();
      ctx.strokeStyle = sw.color;
      ctx.globalAlpha = sw.alpha;
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.r, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }

    for (const a of drops){
      ctx.save();
      ctx.shadowBlur = 18; ctx.shadowColor = '#ffe259';
      const key = a.kind === 'life' ? 'life' : a.kind === 'power' ? 'power' : 'missing';
      if (!pic(key, a.x, a.y, 48, 48)){
        ctx.fillStyle = {life:'#ff1e56',power:'#ffb703',shield:'#00f0ff',slow:'#9de8ff',bomb:'#ff7536'}[a.kind];
        ctx.beginPath(); ctx.arc(a.x, a.y, 20, 0, TAU); ctx.fill();
        ctx.fillStyle = '#061021'; ctx.font = '900 20px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText({life:'♥',power:'⚡',shield:'◆',slow:'❄',bomb:'●'}[a.kind], a.x, a.y);
      }
      ctx.restore();
    }

    for (const e of enemies){
      const sz = e.type === 'boss' ? 180 : e.type === 'tank' ? 96 : 72;
      ctx.save();
      if (e.flash > 0) ctx.filter = 'brightness(2.4) drop-shadow(0 0 10px #ff1e56)';
      pic(e.type, e.x, e.y, sz, sz, e.type==='zig'?Math.sin(e.t*5)*.2:0);
      ctx.restore();
    }

    const bossEnemy = enemies.find(e => e.type === 'boss');
    $('bossBox').style.display = bossEnemy && !bossEnemy.enter ? 'block' : 'none';
    if (bossEnemy) {
      const p = Math.max(0, bossEnemy.hp/bossEnemy.max);
      $('bossFill').style.width = (p*100) + '%';
      $('bossHpPercent').textContent = Math.round(p*100) + '%';
    }

    ctx.globalCompositeOperation = 'lighter';
    for (const b of bad){
      if (!pic('ebullet', b.x, b.y, 28, 28)){
        ctx.shadowBlur = 10; ctx.shadowColor = '#ff1e56';
        ctx.fillStyle = '#ff1e56';
        ctx.beginPath(); ctx.arc(b.x, b.y, 8, 0, TAU); ctx.fill();
      }
    }

    for (const b of remoteShots){
      ctx.shadowBlur = 14; ctx.shadowColor = '#ffb703';
      pic(b.sprite, b.x, b.y, 20, 42, Math.atan2(b.vy, b.vx) + Math.PI/2);
    }

    for (const b of shots){
      ctx.shadowBlur = 15;
      ctx.shadowColor = b.kind === 'fire' ? '#ff7536' : '#00f0ff';
      if (b.kind === 'laser'){
        ctx.fillStyle = '#00f0ff';
        ctx.fillRect(b.x-6, b.y-32, 12, 64);
      } else if (b.kind === 'missile'){
        pic('bullet2', b.x, b.y, 20, 42, Math.atan2(b.vy,b.vx)+Math.PI/2);
      } else if (!pic(net.online && !net.host ? 'bullet2':'bullet', b.x, b.y, 20, 42, Math.atan2(b.vy,b.vx)+Math.PI/2)){
        ctx.fillStyle = '#00f0ff'; ctx.fillRect(b.x-3, b.y-16, 6, 32);
      }
    }
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';

    /* رسم طائرة الحليف في الأونلاين بسلاسة كاملة وميلان واقعي */
    if (net.online){
      for (const [id,p] of net.players){
        if (id === net.myId || !p.alive) continue;
        pic(net.host ? 'player2' : 'player', p.x, p.y, 82, 82, p.tilt || 0);
        ctx.strokeStyle = '#00f59b'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(p.x, p.y, 44, 0, TAU); ctx.stroke();
        ctx.fillStyle = '#a7f3d0';
        ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(p.name || 'حليف', p.x, p.y - 52);
      }
    }

    /* رسم طائرة اللاعب المحلي */
    if (player.alive && state !== 'over' && (player.inv <= 0 || Math.floor(performance.now()/80)%2)){
      pic(net.online && !net.host ? 'player2' : 'player', player.x, player.y, 84, 84, player.tilt);
      if (player.shield > 0){
        ctx.save();
        ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 3;
        ctx.shadowBlur = 20; ctx.shadowColor = '#00f0ff';
        ctx.beginPath(); ctx.arc(player.x, player.y, 46, 0, TAU); ctx.stroke();
        ctx.restore();
      }
    }

    ctx.globalCompositeOperation = 'lighter';
    for (const a of particles){
      ctx.globalAlpha = Math.max(0, a.life/a.max);
      ctx.fillStyle = a.color;
      ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
  }

  function renderLoading(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle = '#030814'; ctx.fillRect(0,0,W,H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 28px sans-serif'; ctx.fillStyle = '#00f0ff';
    ctx.fillText('جاري تحميل الترسانة الكونية...', W/2, H/2 - 20);
    const prog = imgTotal > 0 ? imgLoadedCount/imgTotal : 0;
    ctx.fillStyle = '#081730';
    ctx.fillRect(W/2-120, H/2+20, 240, 14);
    ctx.fillStyle = '#00f0ff';
    ctx.fillRect(W/2-120, H/2+20, 240*prog, 14);
  }

  let last = 0, mainShown = false;
  function loop(ts){
    requestAnimationFrame(loop);
    if (!allImgsReady){ last = ts; renderLoading(); return; }
    if (!mainShown){ mainShown = true; main(); }
    if (document.hidden){ last = ts; return; }
    let dt = Math.min(40, ts - (last||ts));
    last = ts;
    if (state === 'play') update(dt);
    render();
  }

  /* التحكم اللمسي المباشر */
  let dragging = false;
  let lastTouchX = 0, lastTouchY = 0;
  const keys = {};

  function point(e){
    const r = cv.getBoundingClientRect();
    return {
      x: ((e.clientX - r.left) / r.width) * W,
      y: ((e.clientY - r.top) / r.height) * H
    };
  }

  cv.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    dragging = true;
    const a = point(e);
    lastTouchX = a.x;
    lastTouchY = a.y;
    cv.setPointerCapture(e.pointerId);
  }, { passive: false });

  cv.addEventListener('pointermove', e => {
    if (!dragging || state !== 'play') return;
    const a = point(e);
    const sens = { slow: 1.1, normal: 1.45, fast: 1.85 }[save.settings.controls] || 1.45;
    const dx = (a.x - lastTouchX) * sens;
    const dy = (a.y - lastTouchY) * sens;

    lastTouchX = a.x;
    lastTouchY = a.y;

    player.tx = clamp(player.tx + dx, 25, W - 25);
    player.ty = clamp(player.ty + dy, 60, H - 60);
  }, { passive: false });

  const stopDrag = () => { dragging = false; };
  cv.addEventListener('pointerup', stopDrag);
  cv.addEventListener('pointercancel', stopDrag);

  addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault();
    if (e.code === 'Space' && state === 'play') bomb();
  });
  addEventListener('keyup', e => keys[e.code] = false);

  $('pause').onclick = pause;
  $('sound').onclick = () => { sound = !sound; $('sound').textContent = sound ? '🔊' : '🔇'; };
  $('micBtn').onclick = toggleMic;
  $('bombBtn').onclick = bomb;

  persist();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
